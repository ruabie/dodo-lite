<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#F5F7FB" />

  <title>小待 Dodo Lite</title>
  <style>
:root{--bg:#f4f6fb;--card:#fff;--text:#111318;--muted:#7b8190;--line:#e7eaf0;--shadow:0 20px 60px rgba(27,34,55,.08);--accent:#15171c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body{padding:0 0 env(safe-area-inset-bottom)}button,input,select{font:inherit}button{cursor:pointer}.app-shell{width:min(100%,520px);min-height:100vh;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px 110px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.topbar h1,.section-head h2{margin:2px 0 0;font-size:30px;letter-spacing:-.04em}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:#969baa}.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:#fff;box-shadow:0 8px 24px rgba(20,26,44,.08);font-size:26px}.view{display:none}.view.active{display:block}.hero{background:#fff;border-radius:32px;padding:22px;box-shadow:var(--shadow);overflow:hidden;position:relative}.hero::after{content:"";position:absolute;inset:auto -40px -70px auto;width:180px;height:180px;border-radius:50%;background:var(--stateTint,#edf0f6);opacity:.68}.hero .content{position:relative;z-index:1}.dodo-wrap{display:flex;align-items:center;justify-content:center;margin:4px 0 12px}.dodo{position:relative;width:120px;height:108px}.dodo-body{position:absolute;left:15px;top:10px;width:90px;height:82px;border-radius:48% 52% 46% 54%/52% 50% 50% 48%;background:#fff;border:2px solid #dfe3eb;box-shadow:0 12px 28px rgba(37,43,62,.08)}.eye{position:absolute;top:38px;width:6px;height:9px;border-radius:50%;background:#282b31;z-index:3}.eye.left{left:48px}.eye.right{right:48px}.mouth{position:absolute;left:55px;top:56px;width:12px;height:7px;border-bottom:2px solid #30343b;border-radius:0 0 12px 12px;z-index:3}.arm,.leg{position:absolute;background:#fff;border:2px solid #dfe3eb;z-index:0}.arm{width:22px;height:14px;border-radius:50%}.arm.left{left:4px;top:48px;transform:rotate(-16deg)}.arm.right{right:4px;top:48px;transform:rotate(16deg)}.leg{width:22px;height:13px;border-radius:50%;bottom:2px}.leg.left{left:28px;transform:rotate(-8deg)}.leg.right{right:28px;transform:rotate(8deg)}.note{position:absolute;right:2px;top:2px;width:30px;height:25px;border-radius:8px;background:var(--stateTint,#e6ecf7);border:2px solid #dfe3eb;transform:rotate(8deg);z-index:4}.dodo.notice .arm.right{top:27px;right:0;transform:rotate(-35deg)}.dodo.urgent .mouth{border:0;width:8px;height:8px;background:#30343b;border-radius:50%;left:57px}.dodo.danger .eye{height:7px;top:39px}.dodo.danger .mouth{border:0;border-top:2px solid #30343b;border-radius:12px 12px 0 0;top:61px}.dodo.done .arm.left{top:29px;transform:rotate(38deg)}.dodo.done .arm.right{top:29px;transform:rotate(-38deg)}.dodo.done .mouth{height:10px;border-bottom:3px solid #30343b}.status-pill{display:inline-flex;padding:7px 10px;border-radius:999px;background:var(--stateTint);font-size:12px;font-weight:800}.task-title{font-size:29px;line-height:1.08;letter-spacing:-.04em;margin:14px 0 6px}.task-meta{color:var(--muted);font-size:14px}.countdown-box{margin:22px 0 18px}.countdown-label{font-size:12px;color:var(--muted);margin-bottom:4px}.countdown{font-variant-numeric:tabular-nums;font-size:42px;font-weight:800;letter-spacing:-.05em}.primary,.secondary{border:0;border-radius:18px;padding:15px 18px;font-weight:750}.primary{background:var(--accent);color:#fff}.secondary{background:#eef0f4;color:#22252c}.wide{width:100%}.section-head{display:flex;align-items:end;justify-content:space-between;margin:28px 2px 12px}.muted{color:var(--muted)}.small{font-size:13px;line-height:1.5}.stack{display:grid;gap:10px}.task-row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;background:#fff}.task-dot{width:10px;height:10px;border-radius:50%;background:var(--stateTint)}.task-row .main{flex:1;min-width:0}.task-row strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.task-row .right{text-align:right;font-size:12px;color:var(--muted)}.empty{padding:36px 20px;text-align:center;background:#fff;border-radius:26px}.timeline{display:grid;gap:10px}.timeline-item{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:start}.timeline-time{font-size:13px;color:var(--muted);padding-top:12px}.timeline-card{background:#fff;border-radius:20px;padding:14px 16px}.timeline-card.done{opacity:.55}.tabbar{position:fixed;z-index:20;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 28px),492px);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:7px;border-radius:24px;background:rgba(255,255,255,.88);backdrop-filter:blur(22px);box-shadow:0 18px 50px rgba(19,24,40,.16)}.tab{border:0;background:transparent;border-radius:18px;padding:11px 6px;color:#8c92a0;font-weight:700}.tab.active{background:#15171c;color:#fff}.modal-backdrop{position:fixed;z-index:50;inset:0;background:rgba(16,18,24,.26);display:flex;align-items:flex-end;justify-content:center}.modal-backdrop.hidden,.shield-overlay.hidden,.dynamic-island.hidden{display:none}.sheet{width:min(100%,520px);max-height:92vh;overflow:auto;background:#fff;border-radius:30px 30px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -20px 80px rgba(14,18,31,.18)}.sheet-handle{width:38px;height:5px;background:#d6d9e0;border-radius:99px;margin:0 auto 12px}.sheet-head{display:flex;align-items:center;justify-content:space-between}.text-btn{border:0;background:none;color:#707789}form{display:grid;gap:17px}label{display:grid;gap:8px;font-size:14px;font-weight:700}input,select{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fafbfc}.duration-row{display:flex;gap:7px;overflow:auto}.duration-row button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;white-space:nowrap}.duration-row button.selected{background:#15171c;color:#fff;border-color:#15171c}.inline-check{display:flex;grid-template-columns:auto 1fr;align-items:center;gap:10px}.inline-check input{width:18px;height:18px}.settings-card{background:#fff;border-radius:24px;padding:7px 16px;margin-bottom:12px}.settings-card.subtle{padding:18px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}.setting-row:last-child{border-bottom:0}.switch input{display:none}.switch span{display:block;width:48px;height:28px;background:#d8dbe2;border-radius:999px;position:relative;transition:.2s}.switch span::after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 7px rgba(0,0,0,.16)}.switch input:checked+span{background:#191b20}.switch input:checked+span::after{left:23px}.danger-text{border:0;background:transparent;color:#d64545;padding:15px;font-weight:700}.dynamic-island{position:fixed;z-index:40;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);min-width:180px;max-width:88vw;height:40px;border-radius:22px;background:#050505;color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 14px;box-shadow:0 8px 30px rgba(0,0,0,.16);font-size:12px}.dynamic-island .mini-face{width:24px;height:24px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:13px}.shield-overlay{position:fixed;z-index:60;inset:0;background:rgba(233,236,242,.82);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:center;padding:24px}.shield-card{width:min(100%,390px);background:#fff;border-radius:34px;padding:28px;text-align:center;box-shadow:0 30px 90px rgba(19,24,40,.18)}.shield-card h2{font-size:28px;margin:8px 0}.shield-card h3{font-size:19px;margin:4px 0 8px}.shield-card button{margin-top:10px}.focus-wrap{background:#fff;border-radius:32px;padding:28px 22px;text-align:center;box-shadow:var(--shadow);min-height:66vh;display:flex;flex-direction:column;justify-content:center}.focus-time{font-size:56px;font-weight:850;letter-spacing:-.06em;font-variant-numeric:tabular-nums;margin:14px 0 6px}.focus-actions{display:grid;gap:10px;margin-top:26px}

</style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div><div class="eyebrow">DODO LITE</div><h1>小待</h1></div>
      <button id="quickAddBtn" class="icon-btn" aria-label="新建任务">＋</button>
    </header>

    <main id="app">
      <section id="nowView" class="view active">
        <div id="nowHero"></div>
        <div class="section-head"><h2>接下来</h2><span id="nextCount" class="muted"></span></div>
        <div id="nextTasks" class="stack"></div>
      </section>

      <section id="todayView" class="view">
        <div class="section-head"><div><div class="eyebrow">TODAY</div><h2>今天</h2></div></div>
        <div id="todayTasks" class="timeline"></div>
      </section>

      <section id="focusView" class="view"><div id="focusCard"></div></section>

      <section id="settingsView" class="view">
        <div class="section-head"><div><div class="eyebrow">SETTINGS</div><h2>设置</h2></div></div>
        <div class="settings-card">
          <div class="setting-row"><div><strong>视觉提醒强度</strong><div class="muted small">只影响体验版里的视觉表现</div></div><select id="visualMode"><option value="gentle">温和</option><option value="standard">标准</option><option value="strong">强</option></select></div>
          <div class="setting-row"><div><strong>模拟灵动岛</strong><div class="muted small">在顶部展示当前任务状态</div></div><label class="switch"><input id="islandToggle" type="checkbox" checked /><span></span></label></div>
          <div class="setting-row"><div><strong>模拟截止保护</strong><div class="muted small">Danger 时弹出 Shield 模拟层</div></div><label class="switch"><input id="shieldToggle" type="checkbox" checked /><span></span></label></div>
        </div>
        <div class="settings-card"><button id="seedDemoBtn" class="secondary wide">加入演示任务</button><button id="clearAllBtn" class="danger-text wide">清空本地数据</button></div>
        <div class="settings-card subtle"><strong>体验版说明</strong><p class="muted small">此版本用于验证交互与紧迫度体验。灵动岛、锁屏 Live Activity、FamilyControls 与系统 Shield 为模拟效果；正式 iOS 版会接入 Apple 原生能力。</p></div>
      </section>
    </main>

    <nav class="tabbar">
      <button data-view="nowView" class="tab active">现在</button><button data-view="todayView" class="tab">今天</button><button data-view="focusView" class="tab">专注</button><button data-view="settingsView" class="tab">设置</button>
    </nav>
  </div>

  <div id="dynamicIsland" class="dynamic-island hidden"></div>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div><div class="sheet-head"><h2>新建任务</h2><button id="closeModalBtn" class="text-btn">取消</button></div>
      <form id="taskForm">
        <label>做什么？<input id="titleInput" maxlength="60" placeholder="例如：英语演讲预习" required /></label>
        <label>截止时间<input id="deadlineInput" type="datetime-local" required /></label>
        <label>预计需要多久？<div class="duration-row"><button type="button" data-mins="15">15m</button><button type="button" data-mins="30">30m</button><button type="button" data-mins="45" class="selected">45m</button><button type="button" data-mins="60">1h</button><button type="button" data-mins="90">1.5h</button></div><input id="durationInput" type="number" min="5" max="720" value="45" /></label>
        <label>重要程度<select id="priorityInput"><option value="normal">普通</option><option value="important">重要</option><option value="mustDo">必须完成</option></select></label>
        <label class="inline-check"><input id="takeoverInput" type="checkbox" checked /><span>开启截止保护</span></label>
        <button class="primary wide" type="submit">创建任务</button>
      </form>
    </div>
  </div>

  <div id="shieldOverlay" class="shield-overlay hidden"><div class="shield-card"><div id="shieldDodo"></div><div class="eyebrow">DANGER · 体验模拟</div><h2>先做这件事</h2><h3 id="shieldTitle"></h3><p id="shieldMeta" class="muted"></p><button id="shieldStartBtn" class="primary wide">开始任务</button><button id="shieldDismissBtn" class="secondary wide">先退出这个应用</button></div></div>

  <script>
const STORAGE_KEY="dodoLite.tasks.v1", SETTINGS_KEY="dodoLite.settings.v1";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={tasks:loadTasks(),currentView:"nowView",selectedDuration:45,focusTaskId:null,settings:loadSettings()};
function loadTasks(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]")}catch{return[]}}function saveTasks(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state.tasks))}function loadSettings(){try{return JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}")}catch{return{}}}function saveSettings(){localStorage.setItem(SETTINGS_KEY,JSON.stringify(state.settings))}
function priorityMultiplier(p){return p==="mustDo"?1.25:p==="important"?1.15:1}function priorityScore(p){return p==="mustDo"?2:p==="important"?1:0}
function thresholds(t){const d=Math.max(t.estimatedMinutes*60,60),m=priorityMultiplier(t.priority);return{notice:Math.max(d*2.5,3600)*m,urgent:Math.max(d*1.75,1800)*m,danger:Math.max(d*1.10,900)*m}}
function urgency(t,n=Date.now()){if(t.status==="completed")return"done";const r=(new Date(t.deadline).getTime()-n)/1000;if(r<=0)return"overdue";const x=thresholds(t);if(r<=x.danger)return"danger";if(r<=x.urgent)return"urgent";if(r<=x.notice)return"notice";return"calm"}
function risk(t,n=Date.now()){return((new Date(t.deadline).getTime()-n)/1000)/Math.max(t.estimatedMinutes*60,60)}const rank={done:-1,calm:0,notice:1,urgent:2,danger:3,overdue:4};
function activeTasks(){return state.tasks.filter(t=>t.status!=="completed")}function primaryTask(){return[...activeTasks()].sort((a,b)=>{const ua=urgency(a),ub=urgency(b);if(rank[ua]!==rank[ub])return rank[ub]-rank[ua];if(priorityScore(a.priority)!==priorityScore(b.priority))return priorityScore(b.priority)-priorityScore(a.priority);const ra=risk(a),rb=risk(b);if(ra!==rb)return ra-rb;return new Date(a.deadline)-new Date(b.deadline)})[0]||null}
function stateInfo(s){return{calm:{label:"时间充足",tint:"#C8F1E6",line:"今天先记着，不急。"},notice:{label:"可以准备了",tint:"#FFE7A7",line:"差不多可以开始啦。"},urgent:{label:"建议现在开始",tint:"#FFD2AD",line:"现在开始比较稳。"},danger:{label:"时间很紧",tint:"#FFC7C7",line:"先做这件事。"},overdue:{label:"已经超时",tint:"#FFB8B8",line:"先把这件事处理掉。"},done:{label:"完成啦",tint:"#CFEECA",line:"拿下这一项。"}}[s]}
function dodoHTML(s,size=120){const i=stateInfo(s),c=s==="overdue"?"danger":s;return`<div class="dodo-wrap" style="--stateTint:${i.tint}"><div class="dodo ${c}" style="transform:scale(${size/120});margin:${(size-120)/2}px"><div class="dodo-body"></div><div class="eye left"></div><div class="eye right"></div><div class="mouth"></div><div class="arm left"></div><div class="arm right"></div><div class="leg left"></div><div class="leg right"></div><div class="note"></div></div></div>`}
function formatDate(d){return new Date(d).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}function formatTime(d){return new Date(d).toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",hour12:false})}
function countdown(deadline){let ms=new Date(deadline)-Date.now(),neg=ms<0;ms=Math.abs(ms);let sec=Math.floor(ms/1000),h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;if(h>=24){const d=Math.floor(h/24);return`${neg?"超时 ":""}${d}天 ${h%24}小时`}if(h>0)return`${neg?"超时 ":""}${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;return`${neg?"超时 ":""}${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function render(){renderNow();renderToday();renderFocus();renderSettings();renderIsland();maybeShield()}
function renderNow(){const p=primaryTask(),hero=$("#nowHero"),list=$("#nextTasks");if(!p){hero.innerHTML=`<div class="empty">${dodoHTML("calm")}<h2>今天暂时没有事情</h2><p class="muted">有新的任务时，小待会帮你看着时间。</p><button class="primary" onclick="openTaskModal()">创建第一个任务</button></div>`;list.innerHTML="";$("#nextCount").textContent="";return}const u=urgency(p),i=stateInfo(u);hero.innerHTML=`<div class="hero" style="--stateTint:${i.tint}"><div class="content">${dodoHTML(u)}<span class="status-pill">${i.label}</span><h2 class="task-title">${escapeHTML(p.title)}</h2><div class="task-meta">${formatDate(p.deadline)} 截止 · 预计 ${p.estimatedMinutes} 分钟</div><div class="countdown-box"><div class="countdown-label">距离截止</div><div class="countdown">${countdown(p.deadline)}</div></div><div class="task-meta">${i.line}</div><button class="primary wide" style="margin-top:18px" onclick="startFocus('${p.id}')">开始任务</button></div></div>`;const next=activeTasks().filter(t=>t.id!==p.id).sort((a,b)=>new Date(a.deadline)-new Date(b.deadline)).slice(0,3);$("#nextCount").textContent=next.length?`${next.length} 项`:"";list.innerHTML=next.length?next.map(taskRow).join(""):`<div class="empty"><span class="muted">后面暂时没有其他任务。</span></div>`}
function taskRow(t){const u=urgency(t),i=stateInfo(u);return`<div class="task-row" style="--stateTint:${i.tint}"><div class="task-dot"></div><div class="main"><strong>${escapeHTML(t.title)}</strong><span class="muted small">${i.label}</span></div><div class="right">${formatTime(t.deadline)}<br>${t.estimatedMinutes}m</div></div>`}
function renderToday(){const start=new Date();start.setHours(0,0,0,0);const end=new Date(start);end.setDate(end.getDate()+1);const items=[...state.tasks].filter(t=>{const d=new Date(t.deadline);return d>=start&&d<end}).sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));$("#todayTasks").innerHTML=items.length?items.map(t=>{const u=urgency(t),i=stateInfo(u);return`<div class="timeline-item"><div class="timeline-time">${formatTime(t.deadline)}</div><div class="timeline-card ${t.status==="completed"?"done":""}" style="border-left:5px solid ${i.tint}"><strong>${escapeHTML(t.title)}</strong><div class="muted small">预计 ${t.estimatedMinutes} 分钟 · ${i.label}</div></div></div>`}).join(""):`<div class="empty">${dodoHTML("calm",90)}<p class="muted">今天还没有任务。</p></div>`}
function renderFocus(){const t=state.tasks.find(x=>x.id===state.focusTaskId&&x.status!=="completed"),el=$("#focusCard");if(!t){el.innerHTML=`<div class="empty">${dodoHTML("calm")}<h2>还没有开始任务</h2><p class="muted">从 NOW 页面选择一件事开始。</p><button class="secondary" onclick="switchView('nowView')">回到现在</button></div>`;return}const u=urgency(t),start=t.startedAt?new Date(t.startedAt):new Date(),expected=new Date(start.getTime()+t.estimatedMinutes*60000);el.innerHTML=`<div class="focus-wrap" style="--stateTint:${stateInfo(u).tint}">${dodoHTML(u,135)}<div class="eyebrow">FOCUS</div><h2 class="task-title">${escapeHTML(t.title)}</h2><div class="muted">预计 ${t.estimatedMinutes} 分钟</div><div class="focus-time">${countdown(expected)}</div><div class="muted small">专注倒计时</div><div class="focus-actions"><button class="primary wide" onclick="completeTask('${t.id}')">完成任务</button><button class="secondary wide" onclick="switchView('nowView')">暂时离开</button></div></div>`}
function renderSettings(){$("#visualMode").value=state.settings.visualMode||"standard";$("#islandToggle").checked=state.settings.island!==false;$("#shieldToggle").checked=state.settings.shield!==false}
function renderIsland(){const p=primaryTask(),el=$("#dynamicIsland");if(state.settings.island===false||!p){el.classList.add("hidden");return}const u=urgency(p);el.innerHTML=`<div class="mini-face">${u==="danger"||u==="overdue"?"😣":u==="urgent"?"😟":u==="notice"?"👋":"🙂"}</div><strong>${escapeHTML(p.title.slice(0,12))}</strong><span>${countdown(p.deadline).replace("超时 ","+")}</span>`;el.classList.remove("hidden")}
function maybeShield(){const p=primaryTask(),o=$("#shieldOverlay");if(!p||state.settings.shield===false||!p.takeoverEnabled||!["danger","overdue"].includes(urgency(p))||state.focusTaskId===p.id){o.classList.add("hidden");return}const key="shieldShown."+p.id+"."+new Date(p.deadline).getTime();if(sessionStorage.getItem(key)&&state.settings.visualMode!=="strong")return;sessionStorage.setItem(key,"1");$("#shieldDodo").innerHTML=dodoHTML(urgency(p),130);$("#shieldTitle").textContent=p.title;$("#shieldMeta").textContent=`距离截止 ${countdown(p.deadline)} · 预计还需 ${p.estimatedMinutes} 分钟`;$("#shieldStartBtn").onclick=()=>{o.classList.add("hidden");startFocus(p.id)};$("#shieldDismissBtn").onclick=()=>o.classList.add("hidden");o.classList.remove("hidden")}
function switchView(id){state.currentView=id;$$('.view').forEach(v=>v.classList.toggle('active',v.id===id));$$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===id));render()}
function startFocus(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;if(!t.startedAt)t.startedAt=new Date().toISOString();state.focusTaskId=id;saveTasks();switchView('focusView')}
function completeTask(id){const t=state.tasks.find(x=>x.id===id);if(!t)return;t.status='completed';t.completedAt=new Date().toISOString();saveTasks();state.focusTaskId=null;$("#focusCard").innerHTML=`<div class="focus-wrap" style="--stateTint:${stateInfo('done').tint}">${dodoHTML('done',145)}<div class="eyebrow">DONE</div><h2>完成啦</h2><p class="muted">${escapeHTML(t.title)}</p></div>`;setTimeout(()=>switchView('nowView'),1100)}
function openTaskModal(){const d=new Date(Date.now()+2*3600000);d.setSeconds(0,0);$("#deadlineInput").value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);$("#modalBackdrop").classList.remove('hidden');setTimeout(()=>$("#titleInput").focus(),100)}function closeTaskModal(){$("#modalBackdrop").classList.add('hidden');$("#taskForm").reset();state.selectedDuration=45;$("#durationInput").value=45;updateDurationButtons()}function updateDurationButtons(){$$('.duration-row button').forEach(b=>b.classList.toggle('selected',Number(b.dataset.mins)===state.selectedDuration))}
function seedDemo(){const n=Date.now();state.tasks.push(makeTask('英语演讲预习',new Date(n+55*60000),45,'important',true),makeTask('整理金融学笔记',new Date(n+3*3600000),60,'normal',true),makeTask('跑步 30 分钟',new Date(n+6*3600000),30,'normal',false));saveTasks();switchView('nowView')}
function makeTask(title,deadline,mins,priority,takeover){return{id:crypto.randomUUID(),title,deadline:deadline.toISOString(),estimatedMinutes:mins,priority,status:'active',takeoverEnabled:takeover,createdAt:new Date().toISOString(),startedAt:null,completedAt:null}}
function escapeHTML(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
$("#quickAddBtn").onclick=openTaskModal;$("#closeModalBtn").onclick=closeTaskModal;$("#modalBackdrop").addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeTaskModal()});$$('.duration-row button').forEach(b=>b.onclick=()=>{state.selectedDuration=Number(b.dataset.mins);$("#durationInput").value=state.selectedDuration;updateDurationButtons()});$("#durationInput").oninput=e=>state.selectedDuration=Math.max(5,Number(e.target.value)||45);$("#taskForm").onsubmit=e=>{e.preventDefault();const title=$("#titleInput").value.trim(),deadline=new Date($("#deadlineInput").value);if(!title||isNaN(deadline))return;state.tasks.push(makeTask(title,deadline,state.selectedDuration,$("#priorityInput").value,$("#takeoverInput").checked));saveTasks();closeTaskModal();render()};$$('.tab').forEach(t=>t.onclick=()=>switchView(t.dataset.view));$("#visualMode").onchange=e=>{state.settings.visualMode=e.target.value;saveSettings();render()};$("#islandToggle").onchange=e=>{state.settings.island=e.target.checked;saveSettings();render()};$("#shieldToggle").onchange=e=>{state.settings.shield=e.target.checked;saveSettings();render()};$("#seedDemoBtn").onclick=seedDemo;$("#clearAllBtn").onclick=()=>{if(confirm('确定清空体验版里的所有本地任务吗？')){localStorage.removeItem(STORAGE_KEY);state.tasks=[];state.focusTaskId=null;render()}};if(!state.tasks.length)seedDemo();render();setInterval(render,1000);if('serviceWorker'in navigator){navigator.serviceWorker.register('./service-worker.js').catch(()=>{})}window.openTaskModal=openTaskModal;window.startFocus=startFocus;window.completeTask=completeTask;window.switchView=switchView;

</script>
</body>
</html>
