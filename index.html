<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6fbff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小待">
<title>小待 Dodo Lite V3</title>
<style>
:root{
  --bg:#f5f9fd;--ink:#102b4c;--muted:#8092a8;--line:#e6edf4;--white:#fff;
  --green:#51c58b;--blue:#70b3ff;--orange:#ffae5f;--red:#ff6268;--mint:#e7f8ee;
  --shadow:0 18px 50px rgba(45,81,118,.12);--radius:28px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Segoe UI",sans-serif;background:linear-gradient(180deg,#f8fbff,#f2f7fb);color:var(--ink)}
body{overflow-x:hidden}
button,input,select{font:inherit}button{cursor:pointer}
#app{width:min(100%,520px);min-height:100vh;margin:auto;padding:calc(66px + env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom))}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}.brand-face{width:40px;height:40px}.brand-title{font-size:20px;font-weight:850}.brand-title small{font-size:13px;color:#72879e}
.round-btn{width:43px;height:43px;border:0;border-radius:50%;background:white;color:#183957;font-size:26px;box-shadow:0 7px 22px rgba(35,70,105,.10)}
.view{display:none}.view.active{display:block}
.hero{background:linear-gradient(180deg,#eafaff,#faffff);border-radius:32px;padding:16px;box-shadow:var(--shadow)}
.dodo-stage{position:relative;display:grid;place-items:center;min-height:246px;border-radius:25px;background:radial-gradient(circle at 50% 26%,#fff 0 18%,#ebfaff 52%,#e2f8ed 100%);overflow:hidden}
.dodo-stage:before,.dodo-stage:after{content:"";position:absolute;bottom:-26px;width:190px;height:90px;border-radius:50% 50% 0 0;background:#ccefe1;opacity:.75}
.dodo-stage:before{left:-48px}.dodo-stage:after{right:-50px;background:#d5edff}
.whisper{position:absolute;right:16px;top:16px;color:#7696b2;font-size:12px;transform:rotate(-5deg);z-index:3;line-height:1.5}
.task-card{position:relative;margin-top:-30px;background:rgba(255,255,255,.96);border-radius:26px;padding:19px;box-shadow:0 13px 35px rgba(45,78,110,.10);z-index:5}
.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#e8f8ee;color:#31966a;font-size:12px;font-weight:800}
.task-title{font-size:27px;letter-spacing:-.04em;line-height:1.1;margin:12px 0 7px}.meta{font-size:13px;color:var(--muted)}
.remain{margin:17px 0;text-align:center;color:#61768e}.remain strong{font-size:36px;letter-spacing:-.05em;color:#112e50}
.primary,.secondary{border:0;border-radius:18px;padding:15px 17px;font-weight:850}.primary{background:linear-gradient(90deg,#43c483,#5ed093);color:white}.secondary{background:#edf4fa;color:#284763}.wide{width:100%}
.quote{text-align:center;color:#7087a0;font-size:13px;line-height:1.7;padding:15px 16px 2px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 14px}.section-title h2{font-size:30px;margin:0}
.filters{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.filter{border:0;border-radius:12px;padding:8px 12px;background:#ecf3f8;color:#74879c;font-weight:750;font-size:13px}.filter.active{background:#6daeff;color:white}
.stack{display:grid;gap:9px}
.task-row{display:grid;grid-template-columns:56px 1fr 38px;gap:11px;align-items:center;background:white;border:1px solid #edf2f6;border-radius:19px;padding:10px 11px;box-shadow:0 5px 17px rgba(37,70,103,.05)}
.task-icon{width:54px;height:54px;border-radius:14px;background:#f3f9fd;display:grid;place-items:center;overflow:hidden}.task-row strong{display:block;font-size:15px}.sub{font-size:12px;color:#8b99aa;margin-top:4px}.play{width:34px;height:34px;border:0;border-radius:50%;background:#eaf4ff;color:#5a9fe9;font-weight:900}
.focus-card{background:linear-gradient(180deg,#edf9ff,#f8fcff);border-radius:31px;padding:20px 16px 24px;box-shadow:var(--shadow);text-align:center;min-height:min(690px,calc(100vh - 200px));display:flex;flex-direction:column;align-items:center}
.focus-title{font-size:18px;font-weight:850}.focus-stage{height:210px;display:grid;place-items:center}
.ring{width:min(72vw,290px);aspect-ratio:1;border-radius:50%;background:conic-gradient(#71b3ff var(--progress,12%),#d7ebff 0);padding:12px;display:grid;place-items:center;margin-top:-10px}
.ring-inner{width:100%;height:100%;border-radius:50%;background:#f9fcff;display:grid;place-items:center}.focus-time{font-size:clamp(42px,13vw,58px);font-weight:900;letter-spacing:-.06em}
.focus-actions{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:12px;width:100%;margin-top:24px}.circle-action{height:58px;border:0;border-radius:50%;background:#edf4f9;color:#2a4e70;font-size:22px}.circle-action.main{background:#72b3ff;color:white}
.setting-card{background:white;border-radius:22px;padding:6px 15px;margin:12px 0;box-shadow:0 7px 23px rgba(35,70,105,.06)}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.setting-row:last-child{border-bottom:0}
.switch input{display:none}.switch span{display:block;width:48px;height:28px;border-radius:99px;background:#dce5ed;position:relative}.switch span:after{content:"";position:absolute;width:22px;height:22px;top:3px;left:3px;background:white;border-radius:50%;box-shadow:0 2px 7px rgba(0,0,0,.15);transition:.2s}.switch input:checked+span{background:#55c98b}.switch input:checked+span:after{left:23px}
.tabbar{position:fixed;z-index:40;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 24px),496px);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:7px;background:rgba(255,255,255,.92);backdrop-filter:blur(19px);border-radius:25px;box-shadow:0 17px 45px rgba(35,70,105,.15)}.tab{border:0;background:transparent;border-radius:18px;padding:11px 4px;color:#98a6b7;font-weight:800}.tab.active{color:#4f9fe7;background:#eef7ff}
.island{position:fixed;z-index:50;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);height:42px;width:min(78vw,330px);border-radius:24px;background:#050505;color:white;padding:0 12px;display:flex;align-items:center;gap:9px;box-shadow:0 8px 25px rgba(0,0,0,.2);font-size:12px}.island.hidden{display:none}.island-mini{width:30px;height:30px;display:grid;place-items:center;flex:0 0 auto}.island strong{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.island span{white-space:nowrap}
.modal,.danger-screen{position:fixed;z-index:80;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(22,39,57,.26);backdrop-filter:blur(11px)}.hidden{display:none!important}
.sheet{width:min(100%,520px);max-height:90vh;overflow:auto;background:white;border-radius:32px 32px 0 0;padding:11px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -18px 60px rgba(22,42,60,.17)}.handle{width:42px;height:5px;border-radius:10px;background:#dbe3ea;margin:0 auto 12px}.form{display:grid;gap:15px}.form label{display:grid;gap:7px;font-size:13px;font-weight:800}.form input,.form select{width:100%;border:1px solid #e3ebf2;background:#fafcfe;border-radius:14px;padding:13px}
.danger-screen{align-items:stretch;background:linear-gradient(180deg,#ffd1d4,#ffe7e7)}.danger-content{width:min(100%,520px);margin:auto;padding:calc(72px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));text-align:center;color:#552c32}.danger-content h2{font-size:31px;letter-spacing:-.04em;margin:9px 0 5px}.danger-task{background:rgba(255,255,255,.76);border-radius:21px;padding:15px;text-align:left;margin:20px 0}.danger-actions{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}.danger-main{border:0;border-radius:18px;padding:15px;background:#ff6268;color:white;font-weight:900}.danger-later{border:0;border-radius:18px;padding:15px;background:white;color:#68565a;font-weight:800}
.done-flash{position:fixed;z-index:100;inset:0;background:rgba(238,255,244,.97);display:grid;place-items:center;text-align:center}.done-flash h2{font-size:33px;margin:10px 0 4px}
.empty{background:white;border-radius:26px;padding:38px 18px;text-align:center;color:#7c8da0}
/* ---------- DODO SVG / ANIMATION ---------- */
.dodo{--s:180px;width:var(--s);height:var(--s);display:block;overflow:visible;filter:drop-shadow(0 13px 17px rgba(58,84,100,.12));transform-origin:50% 78%}
.dodo .body{fill:url(#bodyGrad);stroke:#e3e8ee;stroke-width:2}.dodo .limb{fill:#fff;stroke:#e3e8ee;stroke-width:2}.dodo .eye{fill:#15171b}.dodo .blush{fill:#ffc1bd;opacity:.62}.dodo .mouth{fill:none;stroke:#171a20;stroke-width:4;stroke-linecap:round}.dodo .note{stroke:#e7dcc0;stroke-width:2}.dodo .prop-line{stroke:#333842;stroke-width:4;stroke-linecap:round}.dodo .star{fill:#ffc928}
.dodo.calm{animation:floaty 3.8s ease-in-out infinite}.dodo.calm .eyes{animation:blink 4.6s infinite}
.dodo.notice{animation:floaty 3.2s ease-in-out infinite}.dodo.notice .arm-r{transform-origin:142px 89px;animation:wave 1.8s ease-in-out infinite}.dodo.notice .eyes{animation:blink 4s infinite}
.dodo.urgent{animation:urgentBob 1.55s ease-in-out infinite}.dodo.urgent .clock{transform-origin:126px 125px;animation:clockNudge 1.55s ease-in-out infinite}.dodo.urgent .eyes{animation:blink 3.6s infinite}
.dodo.danger{animation:dangerPulse .72s ease-in-out infinite}.dodo.danger .note-group{transform-origin:100px 37px;animation:noteShake .48s ease-in-out infinite}
.dodo.done{animation:celebrate 1.25s ease-in-out infinite}.dodo.done .arm-l{transform-origin:55px 90px;animation:armUp 1.25s ease-in-out infinite}.dodo.done .arm-r{transform-origin:145px 90px;animation:armUpR 1.25s ease-in-out infinite}.dodo.done .star{animation:sparkle 1.1s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.08)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg) translateY(-3px)}}
@keyframes urgentBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes clockNudge{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}
@keyframes dangerPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes noteShake{0%,100%{transform:rotate(-2deg)}25%{transform:rotate(4deg)}75%{transform:rotate(-5deg)}}
@keyframes celebrate{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes armUp{0%,100%{transform:rotate(0)}50%{transform:rotate(34deg) translateY(-4px)}}@keyframes armUpR{0%,100%{transform:rotate(0)}50%{transform:rotate(-34deg) translateY(-4px)}}
@keyframes sparkle{0%,100%{opacity:.35;transform:scale(.75)}50%{opacity:1;transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){.dodo,.dodo *{animation:none!important}}
@media (max-height:760px){#app{padding-top:calc(58px + env(safe-area-inset-top))}.dodo-stage{min-height:220px}.task-card{margin-top:-24px}.focus-stage{height:175px}.ring{width:min(62vw,250px)}}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="brand"><div id="brandDodo" class="brand-face"></div><div class="brand-title">小待 <small>Dodo Lite V3</small></div></div>
    <button class="round-btn" id="addTask">＋</button>
  </div>
  <main>
    <section class="view active" id="now"><div id="nowRoot"></div></section>
    <section class="view" id="today">
      <div class="section-title"><h2>今天</h2><button class="round-btn" id="addTask2">＋</button></div>
      <div class="filters"><button class="filter active">全部</button><button class="filter">学习</button><button class="filter">工作</button><button class="filter">生活</button></div>
      <div class="stack" id="todayList"></div>
    </section>
    <section class="view" id="focus"><div id="focusRoot"></div></section>
    <section class="view" id="settings">
      <div class="section-title"><h2>设置</h2></div>
      <div class="setting-card">
        <div class="setting-row"><div><strong>模拟灵动岛</strong><div class="meta">展示当前任务状态</div></div><label class="switch"><input id="toggleIsland" type="checkbox" checked><span></span></label></div>
        <div class="setting-row"><div><strong>模拟重要提醒</strong><div class="meta">Danger 时全屏提醒</div></div><label class="switch"><input id="toggleDanger" type="checkbox" checked><span></span></label></div>
      </div>
      <div class="setting-card">
        <button class="secondary wide" id="demoDanger">体验 Danger 动画</button>
        <button class="secondary wide" id="resetDemo" style="margin-top:8px">恢复演示任务</button>
      </div>
      <div class="setting-card" style="padding:18px"><strong>V3 改动</strong><p class="meta" style="line-height:1.6">Dodo 改成原生 SVG 动态角色，不再使用抠图；修复顶部安全区、Focus 重叠、Done 遮罩与小屏布局。</p></div>
    </section>
  </main>
</div>

<div id="island" class="island hidden"></div>

<nav class="tabbar">
  <button class="tab active" data-view="now">现在</button><button class="tab" data-view="today">今天</button><button class="tab" data-view="focus">专注</button><button class="tab" data-view="settings">设置</button>
</nav>

<div id="modal" class="modal hidden">
  <div class="sheet"><div class="handle"></div>
    <div style="display:flex;align-items:center;justify-content:space-between"><h2>新建任务</h2><button id="closeModal" class="secondary">取消</button></div>
    <form id="form" class="form">
      <label>做什么？<input id="title" required maxlength="50" placeholder="例如：英语演讲预习"></label>
      <label>截止时间<input id="deadline" type="datetime-local" required></label>
      <label>预计需要多久（分钟）<input id="duration" type="number" min="5" max="720" value="45"></label>
      <label>分类<select id="category"><option>学习</option><option>工作</option><option>生活</option></select></label>
      <label>重要程度<select id="priority"><option value="normal">普通</option><option value="important">重要</option><option value="mustDo">必须完成</option></select></label>
      <button class="primary wide">创建任务</button>
    </form>
  </div>
</div>

<div id="dangerScreen" class="danger-screen hidden">
  <div class="danger-content">
    <div id="dangerDodo" style="display:grid;place-items:center"></div>
    <h2>先完成这件事！</h2><div>时间已经很紧了</div>
    <p style="color:#795c61;line-height:1.6">为了不让重要的事被耽误，先完成当前任务吧。</p>
    <div class="danger-task"><strong id="dangerTitle"></strong><div class="meta" id="dangerMeta"></div></div>
    <div class="danger-actions"><button class="danger-main" id="dangerStart">▶ 立即开始</button><button class="danger-later" id="dangerLater">稍后提醒<br><small>15分钟</small></button></div>
  </div>
</div>

<div id="doneFlash" class="done-flash hidden"><div><div id="doneDodo" style="display:grid;place-items:center"></div><h2>完成啦！</h2><div class="meta">重要的事，一件件来。</div></div></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const TASKS_KEY="dodo.v3.tasks", SETTINGS_KEY="dodo.v3.settings";
let tasks=readTasks(), focusId=null, settings=readSettings();

function readTasks(){try{return JSON.parse(localStorage.getItem(TASKS_KEY)||"[]")}catch(e){return[]}}
function writeTasks(){localStorage.setItem(TASKS_KEY,JSON.stringify(tasks))}
function readSettings(){try{return Object.assign({island:true,danger:true},JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}"))}catch(e){return{island:true,danger:true}}}
function writeSettings(){localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}
function makeTask(title,mins,duration,category,priority="normal"){return{id:(crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())),title,deadline:new Date(Date.now()+mins*60000).toISOString(),duration,category,priority,status:"active",startedAt:null,snoozeUntil:null}}
function seed(){tasks=[makeTask("英语演讲预习",135,45,"学习","important"),makeTask("整理房间",257,35,"生活"),makeTask("项目方案修改",1500,60,"工作","important"),makeTask("阅读 30 分钟",370,30,"生活"),Object.assign(makeTask("买生日礼物",520,20,"生活"),{status:"completed"})];writeTasks()}
if(!tasks.length)seed();

function mult(p){return p==="mustDo"?1.25:p==="important"?1.15:1}
function urgency(t,now=Date.now()){if(t.status==="completed")return"done";if(t.snoozeUntil&&new Date(t.snoozeUntil).getTime()>now)return"calm";const left=(new Date(t.deadline).getTime()-now)/1000;if(left<=0)return"overdue";const d=Math.max(t.duration*60,60),m=mult(t.priority);if(left<=Math.max(d*1.1,900)*m)return"danger";if(left<=Math.max(d*1.75,1800)*m)return"urgent";if(left<=Math.max(d*2.5,3600)*m)return"notice";return"calm"}
const ranks={done:-1,calm:0,notice:1,urgent:2,danger:3,overdue:4};
function risk(t){return(new Date(t.deadline)-Date.now())/Math.max(t.duration*60000,60000)}
function primary(){return tasks.filter(t=>t.status!=="completed").sort((a,b)=>{let ua=urgency(a),ub=urgency(b);if(ranks[ua]!==ranks[ub])return ranks[ub]-ranks[ua];if(mult(a.priority)!==mult(b.priority))return mult(b.priority)-mult(a.priority);return risk(a)-risk(b)})[0]||null}
function stateForArt(s){return s==="overdue"?"danger":s}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function when(d){return new Date(d).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}
function words(ms){let neg=ms<0;ms=Math.abs(ms);let min=Math.floor(ms/60000),h=Math.floor(min/60),m=min%60;return`${neg?"超时 ":""}${h?h+"小时 ":""}${m}分钟`}
function clock(ms){let neg=ms<0;ms=Math.abs(ms);let sec=Math.floor(ms/1000),h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return`${neg?"-":""}${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}

function dodoSVG(state,size=180){
  state=stateForArt(state);
  const note={calm:["#fff2c7","🌱"],notice:["#ffedaa","💡"],urgent:["#ffd0a3","◷"],danger:["#ffb1b3","!!"],done:["#dcf3bd","★"]}[state]||["#fff2c7","🌱"];
  const mouth=state==="urgent"||state==="danger"
    ? `<path class="mouth" d="M94 112 Q100 105 106 112"/>`
    : state==="done"
    ? `<path class="mouth" d="M90 109 Q100 121 110 109"/>`
    : `<path class="mouth" d="M92 108 Q100 114 108 108"/>`;
  const eyes=state==="danger"
    ? `<g class="eyes"><path class="prop-line" d="M76 90 l10 5"/><path class="prop-line" d="M124 90 l-10 5"/><ellipse class="eye" cx="84" cy="98" rx="5" ry="7"/><ellipse class="eye" cx="116" cy="98" rx="5" ry="7"/></g>`
    : state==="done"
    ? `<g class="eyes"><path class="prop-line" d="M78 98 q6-8 12 0"/><path class="prop-line" d="M110 98 q6-8 12 0"/></g>`
    : `<g class="eyes" style="transform-origin:100px 98px"><ellipse class="eye" cx="84" cy="98" rx="5" ry="7"/><ellipse class="eye" cx="116" cy="98" rx="5" ry="7"/></g>`;
  const arms=state==="done"
    ? `<ellipse class="limb arm-l" cx="52" cy="86" rx="14" ry="10" transform="rotate(-28 52 86)"/><ellipse class="limb arm-r" cx="148" cy="86" rx="14" ry="10" transform="rotate(28 148 86)"/>`
    : state==="notice"
    ? `<ellipse class="limb arm-l" cx="55" cy="102" rx="14" ry="10" transform="rotate(-12 55 102)"/><ellipse class="limb arm-r" cx="151" cy="78" rx="14" ry="10" transform="rotate(-35 151 78)"/>`
    : `<ellipse class="limb arm-l" cx="54" cy="101" rx="14" ry="10" transform="rotate(-12 54 101)"/><ellipse class="limb arm-r" cx="146" cy="101" rx="14" ry="10" transform="rotate(12 146 101)"/>`;
  const prop=state==="calm"
    ? `<g class="book"><path d="M73 119 Q84 114 99 122 v27 Q85 141 73 145z" fill="#55c88e"/><path d="M127 119 Q116 114 101 122 v27 Q115 141 127 145z" fill="#42b879"/><path d="M100 122v27" stroke="#dff7e9" stroke-width="2"/></g>`
    : state==="urgent"
    ? `<g class="clock"><circle cx="132" cy="130" r="25" fill="#ffaf52" stroke="#eb8e24" stroke-width="3"/><circle cx="132" cy="130" r="19" fill="#fff8eb"/><path class="prop-line" d="M132 130v-12M132 130l10 6"/></g>`
    : "";
  const stars=state==="done"?`<g><path class="star" d="M36 63l4 8 8 4-8 4-4 8-4-8-8-4 8-4z"/><path class="star" d="M164 57l3 6 6 3-6 3-3 6-3-6-6-3 6-3z"/></g>`:"";
  return `<svg class="dodo ${state}" style="--s:${size}px" viewBox="0 0 200 180" role="img" aria-label="小待 ${state}">
    <defs><radialGradient id="bodyGrad" cx="42%" cy="28%"><stop offset="0" stop-color="#fff"/><stop offset=".72" stop-color="#fff"/><stop offset="1" stop-color="#f2f5f8"/></radialGradient></defs>
    ${stars}
    <g class="note-group"><rect class="note" x="76" y="21" width="48" height="38" rx="9" fill="${note[0]}" transform="rotate(2 100 40)"/><text x="100" y="46" text-anchor="middle" font-size="${state==="danger"?19:17}" font-family="-apple-system,Apple Color Emoji,sans-serif" font-weight="800" fill="${state==="danger"?"#ee434d":"#479e58"}">${note[1]}</text></g>
    <ellipse class="limb leg-l" cx="78" cy="153" rx="15" ry="9" transform="rotate(-8 78 153)"/><ellipse class="limb leg-r" cx="122" cy="153" rx="15" ry="9" transform="rotate(8 122 153)"/>
    <ellipse class="body" cx="100" cy="103" rx="57" ry="55"/>
    ${arms}
    <ellipse class="blush" cx="70" cy="110" rx="10" ry="6"/><ellipse class="blush" cx="130" cy="110" rx="10" ry="6"/>
    ${eyes}${mouth}${prop}
  </svg>`;
}

function renderNow(){
  const p=primary(),root=$("#nowRoot");
  if(!p){root.innerHTML=`<div class="empty">${dodoSVG("calm",190)}<h2>今天暂时没有事情</h2><p>有新的任务时，小待会帮你看着时间。</p></div>`;return}
  const u=urgency(p);
  root.innerHTML=`<div class="hero"><div class="dodo-stage"><div class="whisper">加油！<br>你可以的 ♡</div>${dodoSVG(u,220)}</div><div class="task-card"><span class="tag">${p.category}</span><div class="task-title">${esc(p.title)}</div><div class="meta">◷ ${when(p.deadline)} 截止 · 预计 ${p.duration} 分钟</div><div class="remain">还有 <strong>${words(new Date(p.deadline)-Date.now())}</strong></div><button class="primary wide" onclick="startFocus('${p.id}')">▶ 开始任务</button></div><div class="quote">“每一个小小的开始，<br>都会让你更靠近想要的自己。”</div></div>`;
}
function renderToday(){
  $("#todayList").innerHTML=tasks.slice().sort((a,b)=>new Date(a.deadline)-new Date(b.deadline)).map(t=>{const u=urgency(t);return`<div class="task-row" style="${t.status==="completed"?"opacity:.55":""}"><div class="task-icon">${dodoSVG(u,54)}</div><div><strong>${esc(t.title)}</strong><div class="sub">${t.status==="completed"?"已完成":when(t.deadline)} · ${t.category}</div></div><button class="play" ${t.status==="completed"?"disabled":`onclick="startFocus('${t.id}')"`}>${t.status==="completed"?"✓":"▶"}</button></div>`}).join("");
}
function renderFocus(){
  const t=tasks.find(x=>x.id===focusId&&x.status!=="completed"),root=$("#focusRoot");
  if(!t){root.innerHTML=`<div class="empty">${dodoSVG("calm",185)}<h2>还没有开始任务</h2><p>从“现在”或“今天”选择一件事开始。</p></div>`;return}
  if(!t.startedAt)t.startedAt=new Date().toISOString();
  const end=new Date(t.startedAt).getTime()+t.duration*60000,left=end-Date.now(),pct=Math.max(8,Math.min(100,(1-left/(t.duration*60000))*100));
  root.innerHTML=`<div class="focus-card"><div class="focus-title">专注中</div><div class="meta">${esc(t.title)} · ${t.category}</div><div class="focus-stage">${dodoSVG("urgent",190)}</div><div class="ring" style="--progress:${pct}%"><div class="ring-inner"><div><div class="focus-time">${clock(left)}</div><div class="meta">专注进行中</div><div style="margin-top:8px;color:#7893ad">你可以的！♡</div></div></div></div><div class="focus-actions"><button class="circle-action" onclick="leaveFocus()">×</button><button class="circle-action main">Ⅱ</button><button class="circle-action" onclick="completeTask('${t.id}')">✓</button></div></div>`;
}
function renderIsland(){
  const p=primary(),el=$("#island");if(!settings.island||!p){el.classList.add("hidden");return}
  el.innerHTML=`<div class="island-mini">${dodoSVG(urgency(p),30)}</div><strong>${esc(p.title)}</strong><span>${words(new Date(p.deadline)-Date.now())}</span>`;el.classList.remove("hidden")
}
function maybeDanger(force=false){
  const p=primary(),screen=$("#dangerScreen");if(!p||!settings.danger){screen.classList.add("hidden");return}
  const u=urgency(p);if(!force&&!["danger","overdue"].includes(u)){screen.classList.add("hidden");return}
  if(!force&&focusId===p.id){screen.classList.add("hidden");return}
  const key="v3danger."+p.id+"."+new Date(p.deadline).getTime();if(!force&&sessionStorage.getItem(key))return;sessionStorage.setItem(key,"1");
  $("#dangerDodo").innerHTML=dodoSVG("danger",235);$("#dangerTitle").textContent=p.title;$("#dangerMeta").textContent=`${when(p.deadline)} 截止 · 还有 ${words(new Date(p.deadline)-Date.now())}`;
  $("#dangerStart").onclick=()=>{screen.classList.add("hidden");startFocus(p.id)};
  $("#dangerLater").onclick=()=>{p.snoozeUntil=new Date(Date.now()+15*60000).toISOString();writeTasks();screen.classList.add("hidden");renderAll()};
  screen.classList.remove("hidden");
}
function renderAll(){renderNow();renderToday();renderFocus();renderIsland();$("#brandDodo").innerHTML=dodoSVG("calm",40);$("#doneDodo").innerHTML=dodoSVG("done",240);$("#toggleIsland").checked=settings.island;$("#toggleDanger").checked=settings.danger}
function switchView(id){$$(".view").forEach(v=>v.classList.toggle("active",v.id===id));$$(".tab").forEach(b=>b.classList.toggle("active",b.dataset.view===id));renderAll()}
function startFocus(id){focusId=id;const t=tasks.find(x=>x.id===id);if(t&&!t.startedAt)t.startedAt=new Date().toISOString();writeTasks();$("#dangerScreen").classList.add("hidden");switchView("focus")}
function leaveFocus(){focusId=null;switchView("now")}
function completeTask(id){const t=tasks.find(x=>x.id===id);if(!t)return;t.status="completed";t.completedAt=new Date().toISOString();writeTasks();focusId=null;$("#doneFlash").classList.remove("hidden");setTimeout(()=>{$("#doneFlash").classList.add("hidden");switchView("now")},1100)}
function openModal(){const d=new Date(Date.now()+2*3600000);d.setSeconds(0,0);$("#deadline").value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);$("#modal").classList.remove("hidden")}
function closeModal(){$("#modal").classList.add("hidden")}

$("#addTask").onclick=openModal;$("#addTask2").onclick=openModal;$("#closeModal").onclick=closeModal;$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
$("#form").onsubmit=e=>{e.preventDefault();tasks.push({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())),title:$("#title").value.trim(),deadline:new Date($("#deadline").value).toISOString(),duration:Number($("#duration").value),category:$("#category").value,priority:$("#priority").value,status:"active",startedAt:null,snoozeUntil:null});writeTasks();e.target.reset();$("#duration").value=45;closeModal();switchView("now")};
$$(".tab").forEach(b=>b.onclick=()=>switchView(b.dataset.view));
$("#toggleIsland").onchange=e=>{settings.island=e.target.checked;writeSettings();renderAll()};$("#toggleDanger").onchange=e=>{settings.danger=e.target.checked;writeSettings();renderAll()};
$("#demoDanger").onclick=()=>maybeDanger(true);$("#resetDemo").onclick=()=>{seed();focusId=null;renderAll()};
setInterval(()=>{renderAll();maybeDanger(false)},1000);renderAll();
</script>
</body></html>
