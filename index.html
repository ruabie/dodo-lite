<style>
:root{
 --ink:#112e50;--muted:#8191a5;--line:#e6edf4;--green:#52c78a;--blue:#72b4ff;
 --orange:#ffad5d;--red:#ff626a;--shadow:0 18px 48px rgba(40,74,108,.12)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Segoe UI",sans-serif;background:linear-gradient(180deg,#f9fcff,#f2f7fb);color:var(--ink)}
body{overflow-x:hidden}button,input,select{font:inherit}button{cursor:pointer}
#app{width:min(100%,520px);min-height:100vh;margin:auto;padding:calc(68px + env(safe-area-inset-top)) 16px calc(108px + env(safe-area-inset-bottom))}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.brand{display:flex;align-items:center;gap:10px}
.brandTitle{font-size:21px;font-weight:860;letter-spacing:-.03em}.brandTitle small{font-size:13px;color:#75889e}
.roundBtn{border:0;width:45px;height:45px;border-radius:50%;background:#fff;color:#173858;font-size:28px;box-shadow:0 8px 24px rgba(37,72,106,.11)}
.view{display:none}.view.active{display:block}.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 14px}.sectionTitle h2{margin:0;font-size:30px;letter-spacing:-.04em}
.meta{font-size:13px;color:var(--muted)}
.hidden{display:none!important}

/* ===== DODO RIG V2: crisp DOM/CSS layers ===== */
.dodo-rig{
  --size:220px;
  position:relative;width:var(--size);height:var(--size);
  display:block;isolation:isolate;user-select:none;
}
.dodo-shadow{
  position:absolute;z-index:0;left:50%;bottom:8%;
  width:54%;height:9%;transform:translateX(-50%);
  border-radius:50%;background:rgba(41,67,82,.13);filter:blur(7px);
  transform-origin:center;will-change:transform,opacity;
}
.dodo-body{
  position:absolute;z-index:2;left:50%;top:51%;width:68%;height:67%;
  transform:translate(-50%,-50%);transform-origin:50% 78%;
  border-radius:49% 51% 46% 54% / 43% 43% 57% 57%;
  background:
    radial-gradient(circle at 37% 24%,rgba(255,255,255,1) 0 24%,rgba(255,255,255,.96) 42%,rgba(250,247,246,1) 72%,rgba(236,232,231,1) 100%);
  box-shadow:
    inset 9px 12px 17px rgba(255,255,255,.94),
    inset -10px -14px 22px rgba(203,193,191,.22),
    0 17px 25px rgba(43,69,83,.13);
  will-change:transform;
}
.arm,.foot,.note,.face,.prop,.fx-layer{position:absolute;z-index:4;will-change:transform,opacity}
.arm{
  width:22%;height:29%;top:47%;
  border-radius:50% 50% 46% 54%;
  background:radial-gradient(circle at 35% 24%,#fff 0 38%,#faf7f6 62%,#ece7e6 100%);
  box-shadow:inset -7px -9px 13px rgba(197,187,184,.17),0 7px 12px rgba(48,71,82,.10);
  transform-origin:50% 18%;
}
.arm.l{left:10%;transform:rotate(12deg)}
.arm.r{right:10%;transform:rotate(-12deg)}
.foot{
  width:27%;height:14%;bottom:12%;
  border-radius:55% 55% 50% 50%;
  background:radial-gradient(circle at 42% 25%,#fff 0 37%,#f8f5f4 67%,#e8e3e2 100%);
  box-shadow:inset -5px -6px 10px rgba(195,185,182,.15),0 5px 9px rgba(48,71,82,.09);
  transform-origin:center;
}
.foot.l{left:25%;transform:rotate(-7deg)}
.foot.r{right:25%;transform:rotate(7deg)}
.face{z-index:6;left:50%;top:46%;width:45%;height:36%;transform:translate(-50%,-50%);pointer-events:none}
.eye{
  position:absolute;top:18%;width:13%;height:25%;border-radius:50%;
  background:radial-gradient(circle at 38% 26%,#444 0 7%,#0d1014 10% 72%,#000 100%);
  box-shadow:0 1px 2px rgba(0,0,0,.22);transition:transform .16s ease;
}
.eye:after{content:"";position:absolute;width:22%;height:17%;left:24%;top:14%;border-radius:50%;background:rgba(255,255,255,.9)}
.eye.l{left:18%}.eye.r{right:18%}
.cheek{position:absolute;top:51%;width:24%;height:18%;border-radius:50%;background:radial-gradient(ellipse,rgba(255,154,154,.42),rgba(255,154,154,0) 72%);filter:blur(1px)}
.cheek.l{left:1%}.cheek.r{right:1%}
.mouth{
  position:absolute;left:50%;top:51%;width:18%;height:12%;transform:translateX(-50%);
  border-bottom:4px solid #14171b;border-radius:0 0 50% 50%;
}
.mouth.happy{width:25%;height:23%;top:47%;border:0;background:#1b1517;border-radius:12% 12% 52% 52%}
.mouth.happy:after{content:"";position:absolute;left:23%;right:23%;bottom:8%;height:36%;background:#f57f87;border-radius:50%}
.mouth.worry{width:18%;height:11%;top:55%;border:0;border-top:4px solid #14171b;border-radius:50% 50% 0 0}
.brow{display:none;position:absolute;top:3%;width:20%;height:4px;background:#15181b;border-radius:99px}
.brow.l{left:13%;transform:rotate(18deg)}.brow.r{right:13%;transform:rotate(-18deg)}
.note{
  z-index:7;left:50%;top:4%;width:37%;height:27%;transform:translateX(-50%) rotate(2deg);
  border-radius:12%;
  background:linear-gradient(145deg,#fff8cf 0%,#fff2b6 64%,#e8d99e 100%);
  box-shadow:inset 4px 4px 8px rgba(255,255,255,.6),inset -4px -5px 8px rgba(179,158,102,.14),0 8px 12px rgba(51,65,67,.13);
  transform-origin:50% 92%;display:grid;place-items:center;font-size:calc(var(--size)*.10);font-weight:900;color:#35a45b
}
.note:before{content:"";position:absolute;top:-8%;left:47%;width:7%;height:11%;border-radius:50%;background:#ead7a5;box-shadow:0 2px 3px rgba(0,0,0,.08)}
.prop{z-index:8}
.book{left:35%;top:58%;width:31%;height:25%;display:none}
.book .page{position:absolute;top:0;width:52%;height:100%;background:linear-gradient(#59c990,#3fb477);border-radius:10% 6% 12% 12%;box-shadow:inset 0 4px 7px rgba(255,255,255,.18),0 5px 8px rgba(25,99,68,.14)}
.book .page.l{left:0;transform:skewY(7deg) rotate(-4deg)}.book .page.r{right:0;transform:skewY(-7deg) rotate(4deg)}
.clock{display:none;right:16%;bottom:19%;width:31%;aspect-ratio:1;border-radius:50%;background:linear-gradient(145deg,#ffbc64,#ec8b23);box-shadow:inset 4px 4px 7px rgba(255,255,255,.35),0 7px 11px rgba(151,85,18,.17)}
.clock:before{content:"";position:absolute;inset:11%;border-radius:50%;background:#fff9ec;border:2px solid rgba(220,172,116,.38)}
.clock:after{content:"";position:absolute;left:49%;top:29%;width:4px;height:27%;border-radius:3px;background:#252629;transform-origin:50% 90%;box-shadow:7px 11px 0 -1px #252629}
.fx-layer{z-index:10;inset:0;pointer-events:none}
.fx{position:absolute;font-size:calc(var(--size)*.12);font-weight:900;opacity:0;will-change:transform,opacity}
.fx.a{left:6%;top:30%}.fx.b{right:7%;top:26%}.fx.c{right:16%;bottom:24%}

/* state styles */
.dodo-rig[data-state="calm"] .book{display:block}
.dodo-rig[data-state="notice"] .note{background:linear-gradient(145deg,#fff0a8,#ffd96f);color:#ecaa00}
.dodo-rig[data-state="urgent"] .note{background:linear-gradient(145deg,#ffd4aa,#ffb76f);color:#e27b0b}
.dodo-rig[data-state="urgent"] .clock{display:block}
.dodo-rig[data-state="urgent"] .mouth{display:none}.dodo-rig[data-state="urgent"] .mouth.worry{display:block}
.dodo-rig[data-state="danger"] .note{background:linear-gradient(145deg,#ffb9bc,#ff858b);color:#ef3e47}
.dodo-rig[data-state="danger"] .brow{display:block}.dodo-rig[data-state="danger"] .mouth{display:none}.dodo-rig[data-state="danger"] .mouth.worry{display:block}
.dodo-rig[data-state="done"] .note{background:linear-gradient(145deg,#e8f8bd,#cbed83);color:#2daa53}
.dodo-rig[data-state="done"] .mouth{display:none}.dodo-rig[data-state="done"] .mouth.happy{display:block}
.dodo-rig[data-state="done"] .arm.l{top:37%;left:7%;transform:rotate(-42deg)}.dodo-rig[data-state="done"] .arm.r{top:37%;right:7%;transform:rotate(42deg)}
.dodo-rig[data-state="notice"] .arm.r{top:38%;right:5%;transform:rotate(-45deg)}

.hero{background:linear-gradient(180deg,#edfaff,#fbffff);border-radius:34px;padding:16px;box-shadow:var(--shadow)}
.stage{position:relative;min-height:282px;display:grid;place-items:center;border-radius:28px;overflow:hidden;background:radial-gradient(circle at 50% 26%,#fff 0 18%,#ecfaff 52%,#e5f8ee 100%)}
.stage:before,.stage:after{content:"";position:absolute;bottom:-28px;width:205px;height:92px;border-radius:50% 50% 0 0;background:#cceede;opacity:.78}.stage:before{left:-52px}.stage:after{right:-52px;background:#d5edff}
.whisper{position:absolute;z-index:20;right:16px;top:15px;color:#7894ad;font-size:12px;line-height:1.55;transform:rotate(-4deg)}
.card{position:relative;z-index:7;margin-top:-30px;background:rgba(255,255,255,.98);border-radius:28px;padding:20px;box-shadow:0 13px 36px rgba(43,76,111,.10)}
.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#e7f7ef;color:#32986c;font-size:12px;font-weight:820}
.title{font-size:29px;line-height:1.08;letter-spacing:-.045em;margin:12px 0 8px}.remain{text-align:center;margin:18px 0;color:#647a90}.remain strong{font-size:37px;color:#103155;letter-spacing:-.06em}
.primary,.secondary{border:0;border-radius:18px;padding:15px 18px;font-weight:860}.primary{background:linear-gradient(90deg,#46c684,#62d193);color:#fff}.secondary{background:#edf4fa;color:#294663}.wide{width:100%}.quote{text-align:center;color:#7388a0;font-size:13px;line-height:1.72;padding:16px 12px 2px}
.filters{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.filter{border:0;background:#edf3f8;border-radius:12px;padding:8px 12px;color:#75879d;font-weight:760;font-size:13px}.filter.active{background:#6eaeff;color:#fff}.stack{display:grid;gap:9px}
.taskRow{display:grid;grid-template-columns:58px 1fr 38px;gap:11px;align-items:center;background:#fff;border:1px solid #edf2f6;border-radius:20px;padding:10px 11px;box-shadow:0 5px 17px rgba(37,70,103,.05)}
.taskIcon{width:56px;height:56px;border-radius:16px;background:#f5f9fd;display:grid;place-items:center;overflow:hidden}.taskRow strong{display:block;font-size:15px}.sub{font-size:12px;color:#8a98aa;margin-top:4px}.play{border:0;width:34px;height:34px;border-radius:50%;background:#eaf4ff;color:#5a9fe9;font-weight:900}
.focusCard{background:linear-gradient(180deg,#fff9e4,#fffefa);border-radius:31px;padding:20px 16px 24px;box-shadow:var(--shadow);text-align:center;min-height:min(700px,calc(100vh - 205px));display:flex;flex-direction:column;align-items:center}
.focusTitle{font-size:18px;font-weight:850}.focusStage{height:220px;width:100%;display:grid;place-items:center}.ring{width:min(72vw,292px);aspect-ratio:1;border-radius:50%;padding:12px;display:grid;place-items:center;background:conic-gradient(var(--orange) var(--progress,8%),#f7eac4 0);margin-top:0}.ringInner{width:100%;height:100%;border-radius:50%;background:#fffdfa;display:grid;place-items:center}.focusTime{font-size:clamp(43px,13vw,58px);font-weight:900;letter-spacing:-.06em}
.focusActions{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:12px;width:100%;margin-top:22px}.circleBtn{height:58px;border:0;border-radius:50%;background:#f4efe4;color:#5e5742;font-size:22px}.circleBtn.main{background:var(--orange);color:#fff}
.settingCard{background:#fff;border-radius:22px;padding:6px 15px;margin:12px 0;box-shadow:0 7px 23px rgba(35,70,105,.06)}.settingRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}.settingRow:last-child{border-bottom:0}
.switch input{display:none}.switch span{display:block;width:48px;height:28px;border-radius:99px;background:#dce5ed;position:relative}.switch span:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 7px rgba(0,0,0,.15);transition:.2s}.switch input:checked+span{background:#57ca8c}.switch input:checked+span:after{left:23px}
.charGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 0 6px}.charBtn{border:0;border-radius:14px;background:#f5f8fb;padding:7px 2px;font-size:10px;color:#72849a}.charBtn.active{outline:2px solid #78b6f0;background:#eef8ff}.previewBox{height:245px;display:grid;place-items:center;background:linear-gradient(180deg,#f9fcff,#f4f9fc);border-radius:20px;margin:8px 0 12px}
.tabbar{position:fixed;z-index:40;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 24px),496px);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:7px;background:rgba(255,255,255,.93);backdrop-filter:blur(19px);border-radius:25px;box-shadow:0 17px 45px rgba(35,70,105,.15)}.tab{border:0;background:transparent;border-radius:18px;padding:11px 4px;color:#98a6b7;font-weight:800}.tab.active{color:#4f9fe7;background:#eef7ff}
.island{position:fixed;z-index:50;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);height:44px;width:min(82vw,340px);border-radius:24px;background:#050505;color:#fff;padding:0 13px;display:flex;align-items:center;gap:9px;font-size:12px}.island.hidden{display:none}.islandMini{width:32px;height:32px;display:grid;place-items:center;flex:0 0 auto}.island strong{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal,.dangerScreen{position:fixed;z-index:80;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(22,39,57,.26);backdrop-filter:blur(11px)}.sheet{width:min(100%,520px);max-height:90vh;overflow:auto;background:#fff;border-radius:32px 32px 0 0;padding:11px 20px calc(22px + env(safe-area-inset-bottom))}.handle{width:42px;height:5px;border-radius:10px;background:#dbe3ea;margin:0 auto 12px}.form{display:grid;gap:15px}.form label{display:grid;gap:7px;font-size:13px;font-weight:800}.form input,.form select{width:100%;border:1px solid #e3ebf2;background:#fafcfe;border-radius:14px;padding:13px}
.dangerScreen{align-items:stretch;background:linear-gradient(180deg,#ffd2d5,#ffe8e8)}.dangerContent{width:min(100%,520px);margin:auto;padding:calc(72px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));text-align:center;color:#552c32}.dangerContent h2{font-size:31px;margin:9px 0 5px}.dangerTask{background:rgba(255,255,255,.78);border-radius:21px;padding:15px;text-align:left;margin:20px 0}.dangerActions{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}.dangerMain{border:0;border-radius:18px;padding:15px;background:var(--red);color:#fff;font-weight:900}.dangerLater{border:0;border-radius:18px;padding:15px;background:#fff;color:#68565a;font-weight:800}
.doneFlash{position:fixed;z-index:100;inset:0;background:rgba(238,255,244,.97);display:grid;place-items:center;text-align:center}.doneFlash h2{font-size:33px;margin:10px 0 4px}.empty{background:#fff;border-radius:26px;padding:38px 18px;text-align:center;color:#7c8da0}
@media(max-height:760px){#app{padding-top:calc(61px + env(safe-area-inset-top))}.stage{min-height:230px}.card{margin-top:-24px}.focusStage{height:175px}.ring{width:min(63vw,248px)}}
</style>
</head>
<body>
<div id="app">
 <div class="header"><div class="brand"><div id="brandDodo"></div><div class="brandTitle">小待 <small>Dodo V5.2</small></div></div><button class="roundBtn" id="addTask">＋</button></div>
 <main>
  <section class="view active" id="view-now"><div id="nowRoot"></div></section>
  <section class="view" id="view-today"><div class="sectionTitle"><h2>今天</h2><button class="roundBtn" id="addTask2">＋</button></div><div class="filters"><button class="filter active">全部</button><button class="filter">学习</button><button class="filter">工作</button><button class="filter">生活</button></div><div class="stack" id="todayList"></div></section>
  <section class="view" id="view-focus"><div id="focusRoot"></div></section>
  <section class="view" id="view-settings">
   <div class="sectionTitle"><h2>设置</h2></div>
   <div class="settingCard"><div class="settingRow"><div><strong>模拟灵动岛</strong><div class="meta">展示当前任务状态</div></div><label class="switch"><input id="toggleIsland" type="checkbox" checked><span></span></label></div><div class="settingRow"><div><strong>模拟重要提醒</strong><div class="meta">Danger 时显示全屏提醒</div></div><label class="switch"><input id="toggleDanger" type="checkbox" checked><span></span></label></div></div>
   <div class="settingCard" style="padding:14px 15px 16px"><strong>角色实验室 · Rig V2</strong><div class="meta" style="margin-top:3px">这次角色是分层实时渲染，不再放大低清 PNG。</div><div class="charGrid" id="charButtons"></div><div class="previewBox"><div id="charPreview"></div></div></div>
   <div class="settingCard" style="padding:14px 15px"><strong>通知体验</strong><p class="meta">iPhone 添加到主屏幕后可尝试系统通知。</p><button class="secondary wide" id="enableNotifications">开启通知权限</button><button class="secondary wide" id="testNotification" style="margin-top:8px">发送测试通知</button></div>
   <div class="settingCard"><button class="secondary wide" id="demoDanger">体验 Danger 页面</button><button class="secondary wide" id="resetDemo" style="margin-top:8px">恢复演示任务</button></div>
  </section>
 </main>
</div>
<div id="island" class="island hidden"></div>
<nav class="tabbar"><button class="tab active" data-view="now">现在</button><button class="tab" data-view="today">今天</button><button class="tab" data-view="focus">专注</button><button class="tab" data-view="settings">设置</button></nav>

<div id="modal" class="modal hidden"><div class="sheet"><div class="handle"></div><div style="display:flex;align-items:center;justify-content:space-between"><h2>新建任务</h2><button id="closeModal" class="secondary">取消</button></div><form id="form" class="form"><label>做什么？<input id="title" required maxlength="50" placeholder="例如：英语演讲预习"></label><label>截止时间<input id="deadline" type="datetime-local" required></label><label>预计需要多久（分钟）<input id="duration" type="number" min="5" max="720" value="45"></label><label>分类<select id="category"><option>学习</option><option>工作</option><option>生活</option></select></label><label>重要程度<select id="priority"><option value="normal">普通</option><option value="important">重要</option><option value="mustDo">必须完成</option></select></label><button class="primary wide">创建任务</button></form></div></div>

<div id="dangerScreen" class="dangerScreen hidden"><div class="dangerContent"><div id="dangerDodo" style="display:grid;place-items:center"></div><h2>先完成这件事！</h2><div>时间已经很紧了</div><p style="color:#795c61;line-height:1.6">为了不让重要的事被耽误，先完成当前任务吧。</p><div class="dangerTask"><strong id="dangerTitle"></strong><div class="meta" id="dangerMeta"></div></div><div class="dangerActions"><button class="dangerMain" id="dangerStart">▶ 立即开始</button><button class="dangerLater" id="dangerLater">稍后提醒<br><small>15分钟</small></button></div></div></div>
<div id="doneFlash" class="doneFlash hidden"><div><div id="doneDodo" style="display:grid;place-items:center"></div><h2>完成啦！</h2><div class="meta">重要的事，一件件来。</div></div></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const TK="dodo.v52.tasks", SK="dodo.v52.settings";
let tasks=readTasks(),settings=readSettings(),focusId=null,currentView="now",previewState="calm",lastSig="";
function readTasks(){try{return JSON.parse(localStorage.getItem(TK)||"[]")}catch(e){return[]}}
function writeTasks(){localStorage.setItem(TK,JSON.stringify(tasks))}
function readSettings(){try{return Object.assign({island:true,danger:true},JSON.parse(localStorage.getItem(SK)||"{}"))}catch(e){return{island:true,danger:true}}}
function writeSettings(){localStorage.setItem(SK,JSON.stringify(settings))}
function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}
function makeTask(title,mins,duration,category,priority="normal"){return{id:uid(),title,deadline:new Date(Date.now()+mins*60000).toISOString(),duration,category,priority,status:"active",startedAt:null,snoozeUntil:null}}
function seed(){tasks=[makeTask("英语演讲预习",135,45,"学习","important"),makeTask("整理房间",257,35,"生活"),makeTask("项目方案修改",1500,60,"工作","important"),makeTask("阅读 30 分钟",370,30,"生活"),Object.assign(makeTask("买生日礼物",520,20,"生活"),{status:"completed"})];writeTasks()}
if(!tasks.length)seed();
function mult(p){return p==="mustDo"?1.25:p==="important"?1.15:1}
function urgency(t,now=Date.now()){if(t.status==="completed")return"done";if(t.snoozeUntil&&new Date(t.snoozeUntil)>now)return"calm";const left=(new Date(t.deadline)-now)/1000;if(left<=0)return"overdue";const d=Math.max(t.duration*60,60),m=mult(t.priority);if(left<=Math.max(d*1.1,900)*m)return"danger";if(left<=Math.max(d*1.75,1800)*m)return"urgent";if(left<=Math.max(d*2.5,3600)*m)return"notice";return"calm"}
const ranks={done:-1,calm:0,notice:1,urgent:2,danger:3,overdue:4};
function risk(t){return(new Date(t.deadline)-Date.now())/Math.max(t.duration*60000,60000)}
function primary(){return tasks.filter(t=>t.status!=="completed").sort((a,b)=>{const ua=urgency(a),ub=urgency(b);if(ranks[ua]!==ranks[ub])return ranks[ub]-ranks[ua];if(mult(a.priority)!==mult(b.priority))return mult(b.priority)-mult(a.priority);return risk(a)-risk(b)})[0]||null}
function st(s){return s==="overdue"?"danger":s}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function when(d){return new Date(d).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}
function words(ms){const neg=ms<0;ms=Math.abs(ms);const min=Math.floor(ms/60000),h=Math.floor(min/60),m=min%60;return`${neg?"超时 ":""}${h?h+"小时 ":""}${m}分钟`}
function clock(ms){const neg=ms<0;ms=Math.abs(ms);const sec=Math.floor(ms/1000),h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return`${neg?"-":""}${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}

function rigHTML(state="calm",size=220){
 const s=st(state), note={calm:"🌱",notice:"💡",urgent:"◷",danger:"‼",done:"★"}[s];
 const fx=s==="notice"?["!","✦",""]:s==="urgent"?["•","•",""]:s==="danger"?["!","!",""]:s==="done"?["✦","★","✦"]:["","",""];
 return `<div class="dodo-rig" data-state="${s}" style="--size:${size}px">
   <div class="dodo-shadow"></div>
   <div class="foot l"></div><div class="foot r"></div>
   <div class="dodo-body"></div>
   <div class="arm l"></div><div class="arm r"></div>
   <div class="face">
     <div class="brow l"></div><div class="brow r"></div>
     <div class="eye l"></div><div class="eye r"></div>
     <div class="cheek l"></div><div class="cheek r"></div>
     <div class="mouth"></div><div class="mouth happy"></div><div class="mouth worry"></div>
   </div>
   <div class="note">${note}</div>
   <div class="prop book"><div class="page l"></div><div class="page r"></div></div>
   <div class="prop clock"></div>
   <div class="fx-layer"><i class="fx a">${fx[0]}</i><i class="fx b">${fx[1]}</i><i class="fx c">${fx[2]}</i></div>
 </div>`;
}

/* independent part animation */
function bindRig(rig){
 if(!rig||rig.dataset.bound)return;rig.dataset.bound="1";
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const s=rig.dataset.state, body=rig.querySelector(".dodo-body"), note=rig.querySelector(".note"),
 arms=[rig.querySelector(".arm.l"),rig.querySelector(".arm.r")],feet=[rig.querySelector(".foot.l"),rig.querySelector(".foot.r")],eyes=[rig.querySelector(".eye.l"),rig.querySelector(".eye.r")],shadow=rig.querySelector(".dodo-shadow"),book=rig.querySelector(".book"),clockEl=rig.querySelector(".clock"),fx=[...rig.querySelectorAll(".fx")];
 const later=(fn,a,b)=>setTimeout(()=>document.body.contains(rig)&&fn(),a+Math.random()*(b-a));
 function blink(){eyes.forEach(e=>e.animate([{transform:"scaleY(1)"},{transform:"scaleY(.08)",offset:.45},{transform:"scaleY(1)"}],{duration:145,easing:"ease-in-out"}))}
 function glance(dir=1){eyes.forEach(e=>e.animate([{transform:"translateX(0)"},{transform:`translateX(${dir*2.5}px)`,offset:.35},{transform:`translateX(${dir*2.5}px)`,offset:.68},{transform:"translateX(0)"}],{duration:780,easing:"ease-in-out"}))}
 function burst(){fx.forEach((e,i)=>{if(!e.textContent)return;e.animate([{opacity:0,transform:"translateY(6px) scale(.6)"},{opacity:1,transform:`translateY(${-5-i*2}px) scale(1.15)`,offset:.35},{opacity:0,transform:`translateY(${-18-i*3}px) scale(.9)`}],{duration:650+i*60,easing:"cubic-bezier(.2,.8,.2,1)"})})}
 function calm(){
  const d=2600+Math.random()*650;
  body.animate([{transform:"translate(-50%,-50%) rotate(0) scale(1)"},{transform:"translate(-50%,-52%) rotate(.4deg) scale(1.012)",offset:.52},{transform:"translate(-50%,-50%) rotate(0) scale(1)"}],{duration:d,easing:"ease-in-out"});
  note.animate([{transform:"translateX(-50%) rotate(2deg)"},{transform:"translateX(-50%) rotate(3.4deg) translateY(-2px)",offset:.58},{transform:"translateX(-50%) rotate(2deg)"}],{duration:d+120,easing:"ease-in-out"});
  arms.forEach((a,i)=>a.animate([{transform:`rotate(${i? -12:12}deg)`},{transform:`rotate(${i? -10:10}deg) translateY(-2px)`,offset:.55},{transform:`rotate(${i? -12:12}deg)`}],{duration:d+90+i*55,easing:"ease-in-out"}));
  if(book)book.animate([{transform:"translateY(0)"},{transform:"translateY(-2px)",offset:.56},{transform:"translateY(0)"}],{duration:d+80,easing:"ease-in-out"});
  shadow.animate([{transform:"translateX(-50%) scaleX(1)",opacity:.13},{transform:"translateX(-50%) scaleX(.91)",opacity:.10,offset:.52},{transform:"translateX(-50%) scaleX(1)",opacity:.13}],{duration:d,easing:"ease-in-out"});
  if(Math.random()<.45)later(blink,300,900);if(Math.random()<.22)later(()=>glance(Math.random()<.5?-1:1),700,1400);
  later(loop,900,2300);
 }
 function notice(){
  const d=1020;body.animate([{transform:"translate(-50%,-50%)"},{transform:"translate(-50%,-48%) rotate(-2deg)",offset:.18},{transform:"translate(-50%,-55%) rotate(3deg)",offset:.46},{transform:"translate(-50%,-52%) rotate(-1deg)",offset:.72},{transform:"translate(-50%,-50%)"}],{duration:d,easing:"cubic-bezier(.18,.78,.25,1)"});
  arms[1].animate([{transform:"rotate(-45deg)"},{transform:"rotate(-73deg)",offset:.45},{transform:"rotate(-38deg)",offset:.68},{transform:"rotate(-45deg)"}],{duration:d,easing:"cubic-bezier(.18,.78,.25,1)"});
  note.animate([{transform:"translateX(-50%) rotate(2deg)"},{transform:"translateX(-50%) rotate(9deg) translateY(-4px)",offset:.48},{transform:"translateX(-50%) rotate(-1deg)",offset:.75},{transform:"translateX(-50%) rotate(2deg)"}],{duration:d+90,easing:"ease-out"});
  burst();later(blink,120,320);later(loop,1500,3400);
 }
 function urgent(){
  const d=930;body.animate([{transform:"translate(-50%,-50%)"},{transform:"translate(-50%,-48%) rotate(1deg)",offset:.16},{transform:"translate(-50%,-54%) rotate(-2.6deg)",offset:.40},{transform:"translate(-50%,-52%) rotate(1.8deg)",offset:.62},{transform:"translate(-50%,-50%)"}],{duration:d,easing:"cubic-bezier(.18,.78,.25,1)"});
  if(clockEl)clockEl.animate([{transform:"rotate(0)"},{transform:"rotate(-6deg)",offset:.33},{transform:"rotate(5deg)",offset:.55},{transform:"rotate(0)"}],{duration:d,easing:"ease-out"});
  note.animate([{transform:"translateX(-50%) rotate(2deg)"},{transform:"translateX(-50%) rotate(-5deg)",offset:.36},{transform:"translateX(-50%) rotate(5deg)",offset:.56},{transform:"translateX(-50%) rotate(2deg)"}],{duration:d});
  burst();later(loop,1100,2400);
 }
 function danger(){
  const d=800;body.animate([{transform:"translate(-50%,-50%)"},{transform:"translate(-50%,-47%) scale(.99)",offset:.16},{transform:"translate(-50%,-56%) rotate(-2.5deg) scale(1.025)",offset:.40},{transform:"translate(-50%,-54%) rotate(2deg) scale(1.018)",offset:.58},{transform:"translate(-50%,-50%)"}],{duration:d,easing:"cubic-bezier(.18,.78,.25,1)"});
  note.animate([{transform:"translateX(-50%) rotate(2deg)"},{transform:"translateX(-50%) rotate(-8deg)",offset:.40},{transform:"translateX(-50%) rotate(8deg)",offset:.54},{transform:"translateX(-50%) rotate(2deg)"}],{duration:d});
  arms.forEach((a,i)=>a.animate([{transform:`rotate(${i?-12:12}deg)`},{transform:`rotate(${i?-22:22}deg) translateY(-3px)`,offset:.42},{transform:`rotate(${i?-12:12}deg)`}],{duration:d}));
  burst();later(loop,900,1800);
 }
 function done(){
  const d=1040;body.animate([{transform:"translate(-50%,-50%)"},{transform:"translate(-50%,-47%)",offset:.14},{transform:"translate(-50%,-64%) rotate(4deg) scale(1.035)",offset:.38},{transform:"translate(-50%,-56%) rotate(-2deg)",offset:.56},{transform:"translate(-50%,-48%)",offset:.76},{transform:"translate(-50%,-52%)",offset:.88},{transform:"translate(-50%,-50%)"}],{duration:d,easing:"cubic-bezier(.18,.78,.25,1)"});
  arms.forEach((a,i)=>a.animate([{transform:`rotate(${i?42:-42}deg)`},{transform:`rotate(${i?63:-63}deg)`,offset:.38},{transform:`rotate(${i?38:-38}deg)`,offset:.72},{transform:`rotate(${i?42:-42}deg)`}],{duration:d}));
  feet[0].animate([{transform:"rotate(-7deg)"},{transform:"rotate(-18deg) translate(-5px,-8px)",offset:.38},{transform:"rotate(-7deg)"}],{duration:d});feet[1].animate([{transform:"rotate(7deg)"},{transform:"rotate(18deg) translate(5px,-8px)",offset:.38},{transform:"rotate(7deg)"}],{duration:d});
  shadow.animate([{transform:"translateX(-50%) scaleX(1)",opacity:.13},{transform:"translateX(-50%) scaleX(.58)",opacity:.05,offset:.38},{transform:"translateX(-50%) scaleX(1.08)",opacity:.14,offset:.76},{transform:"translateX(-50%) scaleX(1)",opacity:.13}],{duration:d});
  burst();later(loop,2500,4800);
 }
 function loop(){if(!document.body.contains(rig))return;if(s==="calm")calm();else if(s==="notice")notice();else if(s==="urgent")urgent();else if(s==="danger")danger();else done()}
 later(loop,200,800);
 rig.addEventListener("click",()=>{if(s==="calm"){glance(1);arms[1].animate([{transform:"rotate(-12deg)"},{transform:"rotate(-42deg)",offset:.35},{transform:"rotate(-18deg)",offset:.66},{transform:"rotate(-12deg)"}],{duration:700,easing:"ease-out"})}});
}
function bindAll(scope=document){scope.querySelectorAll(".dodo-rig").forEach(bindRig)}

function renderBrand(){brandDodo.innerHTML=rigHTML("calm",44);bindAll(brandDodo)}
function renderNow(force=false){const r=nowRoot,t=primary(),sig=t?`${t.id}:${urgency(t)}`:"none";if(!force&&r.dataset.sig===sig)return;r.dataset.sig=sig;if(!t){r.innerHTML=`<div class="empty">${rigHTML("calm",190)}<h2>今天暂时没有事情</h2><p>有新的任务时，小待会帮你看着时间。</p></div>`;bindAll(r);return}const u=urgency(t),w={calm:"慢下来，<br>一件件来。",notice:"差不多可以<br>开始啦 ♡",urgent:"现在开始，<br>时间比较稳。",danger:"先做这件事。"}[st(u)]||"先做这件事。";r.innerHTML=`<div class="hero"><div class="stage"><div class="whisper">${w}</div>${rigHTML(u,238)}</div><div class="card"><span class="tag">${esc(t.category)}</span><div class="title">${esc(t.title)}</div><div class="meta">◷ ${when(t.deadline)} 截止 · 预计 ${t.duration} 分钟</div><div class="remain">还有 <strong data-left="${t.id}">${words(new Date(t.deadline)-Date.now())}</strong></div><button class="primary wide" onclick="startFocus('${t.id}')">▶ 开始任务</button></div><div class="quote">“每一个小小的开始，<br>都会让你更靠近想要的自己。”</div></div>`;bindAll(r)}
function renderToday(force=false){const r=todayList,sig=tasks.map(t=>`${t.id}:${t.status}:${urgency(t)}`).join("|");if(!force&&r.dataset.sig===sig)return;r.dataset.sig=sig;r.innerHTML=tasks.slice().sort((a,b)=>new Date(a.deadline)-new Date(b.deadline)).map(t=>`<div class="taskRow" style="${t.status==="completed"?"opacity:.55":""}"><div class="taskIcon">${rigHTML(urgency(t),54)}</div><div><strong>${esc(t.title)}</strong><div class="sub">${t.status==="completed"?"已完成":when(t.deadline)} · ${esc(t.category)}</div></div><button class="play" ${t.status==="completed"?"disabled":`onclick="startFocus('${t.id}')"`}>${t.status==="completed"?"✓":"▶"}</button></div>`).join("");bindAll(r)}
function renderFocus(force=false){const r=focusRoot,t=tasks.find(x=>x.id===focusId&&x.status!=="completed");if(!t){if(!force&&r.dataset.sig==="none")return;r.dataset.sig="none";r.innerHTML=`<div class="empty">${rigHTML("calm",185)}<h2>还没有开始任务</h2><p>从“现在”或“今天”选择一件事开始。</p></div>`;bindAll(r);return}if(!t.startedAt)t.startedAt=new Date().toISOString();if(!force&&r.dataset.sig===t.id)return;r.dataset.sig=t.id;r.innerHTML=`<div class="focusCard"><div class="focusTitle">专注中</div><div class="meta">${esc(t.title)} · ${esc(t.category)}</div><div class="focusStage">${rigHTML("urgent",205)}</div><div class="ring" id="focusRing"><div class="ringInner"><div><div class="focusTime" id="focusTimer">00:00:00</div><div class="meta">专注进行中</div><div style="margin-top:8px;color:#9b7d51">你可以的！♡</div></div></div></div><div class="focusActions"><button class="circleBtn" onclick="leaveFocus()">×</button><button class="circleBtn main">Ⅱ</button><button class="circleBtn" onclick="completeTask('${t.id}')">✓</button></div></div>`;bindAll(r)}
function renderIsland(force=false){const t=primary();if(!settings.island||!t){island.classList.add("hidden");island.dataset.sig="";return}const sig=`${t.id}:${urgency(t)}`;if(force||island.dataset.sig!==sig){island.dataset.sig=sig;island.innerHTML=`<div class="islandMini">${rigHTML(urgency(t),31)}</div><strong>${esc(t.title)}</strong><span id="islandRemain">${words(new Date(t.deadline)-Date.now())}</span>`;bindAll(island)}island.classList.remove("hidden")}
function renderLab(){const states=["calm","notice","urgent","danger","done"],names={calm:"Calm",notice:"Notice",urgent:"Urgent",danger:"Danger",done:"Done"};charButtons.innerHTML=states.map(s=>`<button class="charBtn ${previewState===s?"active":""}" data-s="${s}">${names[s]}</button>`).join("");charPreview.innerHTML=rigHTML(previewState,215);bindAll(charPreview);charButtons.querySelectorAll("button").forEach(b=>b.onclick=()=>{previewState=b.dataset.s;renderLab()})}
function renderSettings(){toggleIsland.checked=settings.island;toggleDanger.checked=settings.danger;renderLab()}
function renderAll(force=false){renderNow(force);renderToday(force);renderFocus(force);renderIsland(force);if(currentView==="settings")renderSettings()}
function updateClocks(){const p=primary();if(p){document.querySelectorAll(`[data-left="${p.id}"]`).forEach(e=>e.textContent=words(new Date(p.deadline)-Date.now()));const ir=document.getElementById("islandRemain");if(ir)ir.textContent=words(new Date(p.deadline)-Date.now())}const t=tasks.find(x=>x.id===focusId&&x.status!=="completed");if(t&&t.startedAt){const d=t.duration*60000,left=new Date(t.startedAt).getTime()+d-Date.now(),ft=document.getElementById("focusTimer"),fr=document.getElementById("focusRing");if(ft)ft.textContent=clock(left);if(fr)fr.style.setProperty("--progress",`${Math.max(8,Math.min(100,(1-left/d)*100))}%`)}}
function maybeDanger(force=false){const t=primary();if(!t||!settings.danger){dangerScreen.classList.add("hidden");return}const u=urgency(t);if(!force&&!["danger","overdue"].includes(u)){dangerScreen.classList.add("hidden");return}if(!force&&focusId===t.id){dangerScreen.classList.add("hidden");return}const key="v52danger."+t.id+"."+new Date(t.deadline).getTime();if(!force&&sessionStorage.getItem(key))return;sessionStorage.setItem(key,"1");dangerDodo.innerHTML=rigHTML("danger",250);bindAll(dangerDodo);dangerTitle.textContent=t.title;dangerMeta.textContent=`${when(t.deadline)} 截止 · 还有 ${words(new Date(t.deadline)-Date.now())}`;dangerStart.onclick=()=>{dangerScreen.classList.add("hidden");startFocus(t.id)};dangerLater.onclick=()=>{t.snoozeUntil=new Date(Date.now()+15*60000).toISOString();writeTasks();dangerScreen.classList.add("hidden");renderAll(true)};dangerScreen.classList.remove("hidden")}
function switchView(v){currentView=v;$$(".view").forEach(x=>x.classList.toggle("active",x.id==="view-"+v));$$(".tab").forEach(x=>x.classList.toggle("active",x.dataset.view===v));renderAll(true);updateClocks()}
function startFocus(id){focusId=id;const t=tasks.find(x=>x.id===id);if(t&&!t.startedAt)t.startedAt=new Date().toISOString();writeTasks();dangerScreen.classList.add("hidden");switchView("focus")}
function leaveFocus(){focusId=null;switchView("now")}
function completeTask(id){const t=tasks.find(x=>x.id===id);if(!t)return;t.status="completed";t.completedAt=new Date().toISOString();writeTasks();focusId=null;doneDodo.innerHTML=rigHTML("done",255);bindAll(doneDodo);doneFlash.classList.remove("hidden");setTimeout(()=>{doneFlash.classList.add("hidden");switchView("now")},1700)}
function openModal(){const d=new Date(Date.now()+2*3600000);d.setSeconds(0,0);deadline.value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);modal.classList.remove("hidden")}
function closeModal(){modal.classList.add("hidden")}
addTask.onclick=openModal;addTask2.onclick=openModal;closeModal.onclick=closeModal;modal.addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
form.onsubmit=e=>{e.preventDefault();tasks.push({id:uid(),title:title.value.trim(),deadline:new Date(deadline.value).toISOString(),duration:Number(duration.value),category:category.value,priority:priority.value,status:"active",startedAt:null,snoozeUntil:null});writeTasks();e.target.reset();duration.value=45;closeModal();renderAll(true);updateClocks()};
$$(".tab").forEach(b=>b.onclick=()=>switchView(b.dataset.view));toggleIsland.onchange=e=>{settings.island=e.target.checked;writeSettings();renderIsland(true)};toggleDanger.onchange=e=>{settings.danger=e.target.checked;writeSettings()};demoDanger.onclick=()=>maybeDanger(true);resetDemo.onclick=()=>{seed();focusId=null;renderAll(true);updateClocks()};

async function regSW(){if(!("serviceWorker" in navigator))return null;try{return await navigator.serviceWorker.register("./sw.js")}catch(e){return null}}
enableNotifications.onclick=async()=>{if(!("Notification" in window)){alert("iPhone 请先把小待添加到主屏幕，再从主屏幕打开。");return}const p=await Notification.requestPermission();alert(p==="granted"?"通知权限已开启。":"通知权限没有开启。")};
testNotification.onclick=async()=>{if(!("Notification" in window)){alert("请先添加到主屏幕再测试。");return}if(Notification.permission!=="granted"){alert("请先开启通知权限。");return}const reg=await regSW();if(reg)await reg.showNotification("小待 Dodo",{body:"💡 英语演讲预习：差不多可以开始啦 ♡",silent:true,tag:"dodo-test"});else new Notification("小待 Dodo",{body:"英语演讲预习：差不多可以开始啦 ♡",silent:true})};

regSW();renderBrand();renderAll(true);updateClocks();
setInterval(()=>{updateClocks();const p=primary(),sig=p?`${p.id}:${urgency(p)}`:"none";if(sig!==lastSig){lastSig=sig;renderNow(true);renderToday(true);renderIsland(true);updateClocks()}maybeDanger(false)},1000);
</script>
</body>
</html>
