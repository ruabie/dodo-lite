<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6fbff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小待">
<title>小待 Dodo Lite · Experience V2</title>
<style>
:root {
  --bg:#f5f9fd; --ink:#0d2544; --muted:#8190a6; --line:#e7edf4;
  --card:#ffffff; --cyan:#e8f7ff; --mint:#dff7e8; --green:#4fc58a;
  --blue:#64a9ff; --orange:#ffb45f; --red:#ff6267; --pink:#ffe7e8;
  --shadow:0 18px 50px rgba(36,77,120,.12); --r:28px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Segoe UI",sans-serif;background:linear-gradient(180deg,#f7fbff 0,#f3f7fb 100%);color:var(--ink)}
button,input,select{font:inherit}
button{cursor:pointer}
#shell{width:min(100%,520px);min-height:100vh;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(104px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 5px 16px rgba(40,70,100,.12)}
.brand-title{font-size:20px;font-weight:800;letter-spacing:-.03em}
.brand-title small{font-weight:600;color:#657893}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:#0c294c;font-size:27px;box-shadow:0 8px 24px rgba(30,70,110,.10)}
.view{display:none} .view.active{display:block}
.hero{background:linear-gradient(180deg,#eafaff,#f7ffff);border-radius:32px;padding:18px;box-shadow:var(--shadow);overflow:hidden}
.hero-art{background:linear-gradient(180deg,#eafaff,#edfaff);border-radius:26px;padding:10px 10px 0;text-align:center;position:relative;min-height:270px;overflow:hidden}
.hero-art:before{content:"";position:absolute;left:-45px;bottom:0;width:150px;height:90px;border-radius:60% 60% 0 0;background:#dff5ec;opacity:.85}
.hero-art:after{content:"";position:absolute;right:-45px;bottom:-8px;width:170px;height:110px;border-radius:60% 60% 0 0;background:#d8f0ff;opacity:.8}
.hero-art img{width:220px;height:220px;object-fit:cover;border-radius:30px;position:relative;z-index:2;mix-blend-mode:multiply}
.whisper{position:absolute;right:10px;top:12px;color:#6788a9;font-size:12px;transform:rotate(-4deg);z-index:3}
.task-panel{margin-top:-28px;background:rgba(255,255,255,.96);position:relative;z-index:4;border-radius:26px;padding:20px;box-shadow:0 15px 35px rgba(58,93,130,.09)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:99px;background:#e7f8ec;color:#2a9b65;font-size:12px;font-weight:750}
.task-panel h1{font-size:27px;line-height:1.12;margin:12px 0 8px;letter-spacing:-.04em}
.meta{color:#71839c;font-size:13px}
.big-remain{margin:18px 0 12px;font-size:18px;text-align:center;color:#53677f}
.big-remain strong{font-size:38px;color:#102c50;letter-spacing:-.05em}
.primary{border:0;background:linear-gradient(90deg,#42c582,#5bcf91);color:#fff;border-radius:18px;padding:15px 18px;font-weight:800;box-shadow:0 8px 20px rgba(74,196,136,.20)}
.secondary{border:0;background:#eef4fa;color:#244364;border-radius:18px;padding:14px 18px;font-weight:750}
.wide{width:100%}
.quote{text-align:center;color:#7088a2;font-size:13px;line-height:1.7;padding:16px 22px 4px}
.section-head{display:flex;align-items:end;justify-content:space-between;margin:24px 3px 12px}
.section-head h2{font-size:29px;letter-spacing:-.04em;margin:0}
.pills{display:flex;gap:8px;overflow:auto;margin:8px 0 12px}
.pill{border:0;background:#edf3f8;color:#6e8199;border-radius:12px;padding:8px 12px;white-space:nowrap;font-weight:700;font-size:13px}
.pill.active{background:#65a9ff;color:white}
.stack{display:grid;gap:10px}
.task-row{display:grid;grid-template-columns:56px 1fr 42px;gap:12px;align-items:center;background:#fff;border:1px solid #edf1f6;border-radius:20px;padding:10px 12px;box-shadow:0 6px 18px rgba(36,69,105,.05)}
.task-row img{width:54px;height:54px;border-radius:14px;object-fit:cover}
.task-row strong{display:block;font-size:15px}
.task-row .sub{font-size:12px;color:#8a98aa;margin-top:4px}
.play{width:36px;height:36px;border-radius:50%;border:0;background:#eaf4ff;color:#5a9ee8;font-weight:900}
.focus-card{background:linear-gradient(180deg,#eef9ff,#f7fbff);border-radius:32px;padding:24px 18px;text-align:center;min-height:72vh;box-shadow:var(--shadow)}
.focus-card img{width:205px;height:205px;object-fit:cover;border-radius:36px;mix-blend-mode:multiply}
.focus-ring{width:270px;height:270px;margin:-16px auto 0;border-radius:50%;background:conic-gradient(#67aaff var(--progress,72%),#d9ecff 0);display:grid;place-items:center;padding:12px}
.focus-inner{width:100%;height:100%;border-radius:50%;background:#f9fcff;display:grid;place-items:center;padding:20px}
.focus-time{font-size:52px;font-weight:850;letter-spacing:-.06em}
.focus-actions{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:10px;margin-top:20px}
.circle-action{height:58px;border-radius:50%;border:0;background:#eef4f8;color:#244568;font-size:20px}
.circle-action.main{background:#7ab6ff;color:#fff;font-size:24px}
.setting-card{background:#fff;border-radius:22px;padding:6px 15px;margin:12px 0;box-shadow:0 8px 25px rgba(35,73,110,.06)}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border-bottom:0}
.switch input{display:none} .switch span{display:block;width:48px;height:28px;border-radius:99px;background:#dce5ee;position:relative}
.switch span:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 7px rgba(0,0,0,.15);transition:.2s}
.switch input:checked + span{background:#55c98a} .switch input:checked + span:after{left:23px}
.tabbar{position:fixed;z-index:30;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 26px),494px);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);padding:7px;border-radius:25px;box-shadow:0 18px 45px rgba(35,70,105,.15)}
.tab{border:0;background:transparent;border-radius:18px;padding:11px 5px;color:#97a5b7;font-weight:750}
.tab.active{color:#4f9ee5;background:#eef7ff}
.island{position:fixed;z-index:50;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);height:41px;max-width:88vw;min-width:210px;background:#040404;color:white;border-radius:24px;padding:0 14px;display:flex;align-items:center;gap:9px;box-shadow:0 10px 28px rgba(0,0,0,.20);font-size:12px}
.island.hidden{display:none} .island img{width:28px;height:28px;border-radius:50%;object-fit:cover} .island strong{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal,.danger-screen{position:fixed;z-index:70;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(30,47,66,.28);backdrop-filter:blur(10px)}
.modal.hidden,.danger-screen.hidden{display:none}
.sheet{width:min(100%,520px);max-height:92vh;overflow:auto;background:white;border-radius:32px 32px 0 0;padding:12px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(20,40,60,.18)}
.handle{width:42px;height:5px;border-radius:10px;background:#dbe2ea;margin:0 auto 12px}
.form{display:grid;gap:15px} .form label{display:grid;gap:7px;font-size:13px;font-weight:750} .form input,.form select{width:100%;border:1px solid #e4ebf2;border-radius:14px;padding:13px;background:#f9fbfd}
.danger-screen{align-items:stretch;background:linear-gradient(180deg,#ffd3d6,#ffe8e8)}
.danger-card{width:min(100%,520px);margin:auto;padding:calc(28px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));text-align:center;color:#52272d}
.danger-card img{width:245px;height:245px;border-radius:40px;object-fit:cover;mix-blend-mode:multiply}
.danger-card h2{font-size:31px;margin:10px 0 6px;letter-spacing:-.04em}
.danger-task{background:rgba(255,255,255,.72);border-radius:22px;padding:15px;text-align:left;margin:22px 0}
.danger-actions{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}
.danger-main{background:#ff6267;color:#fff;border:0;border-radius:18px;padding:15px;font-weight:850}
.danger-later{background:#fff;color:#5f5155;border:0;border-radius:18px;padding:15px;font-weight:750}
.empty{padding:42px 20px;text-align:center;background:#fff;border-radius:26px;color:#7e8da1}
.done-flash{position:fixed;z-index:90;inset:0;background:rgba(239,255,244,.94);display:grid;place-items:center;text-align:center}
.done-flash.hidden{display:none} .done-flash img{width:250px;height:250px;border-radius:42px;object-fit:cover;mix-blend-mode:multiply}
</style>
</head>
<body>
<div id="shell">
  <header>
    <div class="brand"><img id="brandMascot" alt="小待"><div class="brand-title">小待 <small>Dodo Lite</small></div></div>
    <button class="icon-btn" id="addBtn">＋</button>
  </header>

  <main>
    <section id="now" class="view active"><div id="nowContent"></div></section>

    <section id="today" class="view">
      <div class="section-head"><h2>今天</h2><button class="icon-btn" id="addBtn2">＋</button></div>
      <div class="pills">
        <button class="pill active">全部</button><button class="pill">学习</button><button class="pill">工作</button><button class="pill">生活</button>
      </div>
      <div id="todayList" class="stack"></div>
    </section>

    <section id="focus" class="view"><div id="focusContent"></div></section>

    <section id="settings" class="view">
      <div class="section-head"><h2>设置</h2></div>
      <div class="setting-card">
        <div class="setting-row"><div><strong>模拟灵动岛</strong><div class="meta">展示当前任务</div></div><label class="switch"><input id="islandSwitch" type="checkbox" checked><span></span></label></div>
        <div class="setting-row"><div><strong>模拟重要提醒</strong><div class="meta">Danger 状态显示全屏提醒</div></div><label class="switch"><input id="dangerSwitch" type="checkbox" checked><span></span></label></div>
      </div>
      <div class="setting-card">
        <button class="secondary wide" id="demoDanger">体验重要提醒</button>
        <button class="secondary wide" id="seedBtn" style="margin-top:9px">恢复演示任务</button>
      </div>
      <div class="setting-card" style="padding:18px">
        <strong>关于体验版</strong><p class="meta" style="line-height:1.6">这个版本真实实现任务、NOW、Today、Focus、倒计时、本地保存和角色状态。灵动岛、锁屏与系统级 Shield 目前为视觉模拟。</p>
      </div>
    </section>
  </main>
</div>

<nav class="tabbar">
  <button class="tab active" data-view="now">现在</button>
  <button class="tab" data-view="today">今天</button>
  <button class="tab" data-view="focus">专注</button>
  <button class="tab" data-view="settings">设置</button>
</nav>

<div id="island" class="island hidden"></div>

<div id="taskModal" class="modal hidden">
  <div class="sheet">
    <div class="handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:center"><h2>新建任务</h2><button id="closeModal" class="secondary">取消</button></div>
    <form id="taskForm" class="form">
      <label>做什么？<input id="titleInput" required maxlength="50" placeholder="例如：英语演讲预习"></label>
      <label>截止时间<input id="deadlineInput" type="datetime-local" required></label>
      <label>预计需要多久（分钟）<input id="durationInput" type="number" min="5" max="720" value="45" required></label>
      <label>分类<select id="categoryInput"><option>学习</option><option>工作</option><option>生活</option></select></label>
      <label>重要程度<select id="priorityInput"><option value="normal">普通</option><option value="important">重要</option><option value="mustDo">必须完成</option></select></label>
      <button class="primary wide" type="submit">创建任务</button>
    </form>
  </div>
</div>

<div id="dangerScreen" class="danger-screen hidden">
  <div class="danger-card">
    <img id="dangerArt" alt="Danger 小待">
    <h2>先完成这件事！</h2>
    <div>时间已经很紧了</div>
    <p style="color:#76565c;line-height:1.6">“为了不让重要的事被耽误，先完成当前任务吧！”</p>
    <div class="danger-task"><strong id="dangerTitle"></strong><div class="meta" id="dangerMeta"></div></div>
    <div class="danger-actions"><button id="dangerStart" class="danger-main">▶ 立即开始</button><button id="dangerLater" class="danger-later">稍后提醒<br><small>15分钟</small></button></div>
  </div>
</div>

<div id="doneFlash" class="done-flash hidden"><div><img id="doneArt"><h2>完成啦！</h2><p class="meta">重要的事，一件件来。</p></div></div>

const STORE="dodo.experience.v2.tasks", SET="dodo.experience.v2.settings";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let tasks=loadTasks(), focusId=null, settings=loadSettings(), tick=null;

function loadTasks(){try{return JSON.parse(localStorage.getItem(STORE)||"[]")}catch{return[]}}
function saveTasks(){localStorage.setItem(STORE,JSON.stringify(tasks))}
function loadSettings(){try{return Object.assign({island:true,danger:true},JSON.parse(localStorage.getItem(SET)||"{}"))}catch{return{island:true,danger:true}}}
function saveSettings(){localStorage.setItem(SET,JSON.stringify(settings))}
function mk(title,minsFromNow,duration,category,priority="normal"){return{id:crypto.randomUUID(),title,deadline:new Date(Date.now()+minsFromNow*60000).toISOString(),duration,category,priority,status:"active",startedAt:null,snoozeUntil:null}}
function seed(){tasks=[mk("英语演讲预习",138,45,"学习","important"),mk("整理房间",258,35,"生活"),mk("项目方案修改",1560,60,"工作","important"),mk("阅读 30 分钟",380,30,"生活"),{...mk("买生日礼物",520,20,"生活"),status:"completed"}];saveTasks();render()}
if(!tasks.length) seed();

function mult(p){return p==="mustDo"?1.25:p==="important"?1.15:1}
function urgency(t,now=Date.now()){if(t.status==="completed")return"done";if(t.snoozeUntil&&new Date(t.snoozeUntil)>now)return"calm";const r=(new Date(t.deadline)-now)/1000;if(r<=0)return"overdue";const d=Math.max(t.duration*60,60),m=mult(t.priority);if(r<=Math.max(d*1.1,900)*m)return"danger";if(r<=Math.max(d*1.75,1800)*m)return"urgent";if(r<=Math.max(d*2.5,3600)*m)return"notice";return"calm"}
const R={done:-1,calm:0,notice:1,urgent:2,danger:3,overdue:4};
function risk(t){return(new Date(t.deadline)-Date.now())/Math.max(t.duration*60000,60000)}
function primary(){return tasks.filter(t=>t.status!=="completed").sort((a,b)=>{let ua=urgency(a),ub=urgency(b);if(R[ua]!==R[ub])return R[ub]-R[ua];if(mult(a.priority)!==mult(b.priority))return mult(b.priority)-mult(a.priority);return risk(a)-risk(b)})[0]||null}
function artState(s){return s==="overdue"?"danger":s}
function fmtClock(ms){let neg=ms<0;ms=Math.abs(ms);let sec=Math.floor(ms/1000),h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;if(h>=24)return`${neg?"超时 ":""}${Math.floor(h/24)}天 ${h%24}小时`;return`${neg?"超时 ":""}${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function remainWords(ms){let neg=ms<0;ms=Math.abs(ms);let min=Math.floor(ms/60000),h=Math.floor(min/60),m=min%60;return`${neg?"超时 ":""}${h?`${h}小时 `:""}${m}分钟`}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function dateText(d){return new Date(d).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}

function renderNow(){
  const p=primary(), el=$("#nowContent");
  if(!p){el.innerHTML=`<div class="empty"><img src="${ART.calm}" style="width:180px;border-radius:30px"><h2>今天暂时没有事情</h2><p>有新的任务时，小待会陪你看着时间。</p></div>`;return}
  const u=urgency(p), a=ART[artState(u)];
  el.innerHTML=`<div class="hero"><div class="hero-art"><div class="whisper">加油！<br>你可以的！♡</div><img src="${a}"></div><div class="task-panel"><span class="tag">${p.category}</span><h1>${esc(p.title)}</h1><div class="meta">◷ ${dateText(p.deadline)} 截止 · 预计 ${p.duration} 分钟</div><div class="big-remain">还有 <strong>${remainWords(new Date(p.deadline)-Date.now())}</strong></div><button class="primary wide" onclick="startFocus('${p.id}')">▶ 开始任务</button></div><div class="quote">“每一个小小的开始，<br>都会让你更靠近想要的自己。”</div></div>`;
}
function renderToday(){
  $("#todayList").innerHTML=tasks.slice().sort((a,b)=>new Date(a.deadline)-new Date(b.deadline)).map(t=>{const u=urgency(t);return`<div class="task-row" style="${t.status==="completed"?"opacity:.55":""}"><img src="${ART[artState(u)]}"><div><strong>${esc(t.title)}</strong><div class="sub">${t.status==="completed"?"已完成":dateText(t.deadline)} · ${t.category}</div></div><button class="play" onclick="${t.status==="completed"?"":"startFocus('"+t.id+"')"}">${t.status==="completed"?"✓":"▶"}</button></div>`}).join("");
}
function renderFocus(){
  const t=tasks.find(x=>x.id===focusId&&x.status!=="completed"),el=$("#focusContent");
  if(!t){el.innerHTML=`<div class="empty"><img src="${ART.calm}" style="width:180px;border-radius:30px"><h2>还没有开始任务</h2><p>从“现在”或“今天”选择一件事开始。</p></div>`;return}
  if(!t.startedAt)t.startedAt=new Date().toISOString();
  const end=new Date(t.startedAt).getTime()+t.duration*60000,remain=end-Date.now(),pct=Math.max(0,Math.min(100,(1-remain/(t.duration*60000))*100));
  el.innerHTML=`<div class="focus-card"><div style="font-weight:800">专注中</div><div class="meta">${esc(t.title)} · ${t.category}</div><img src="${ART.urgent}"><div class="focus-ring" style="--progress:${Math.max(8,pct)}%"><div class="focus-inner"><div><div class="focus-time">${fmtClock(remain)}</div><div class="meta">专注进行中</div><div style="margin-top:8px;color:#7391b2">你可以的！♡</div></div></div></div><div class="focus-actions"><button class="circle-action" onclick="abandonFocus()">×</button><button class="circle-action main">Ⅱ</button><button class="circle-action" onclick="completeTask('${t.id}')">✓</button></div></div>`;
}
function renderIsland(){
  const p=primary(),el=$("#island");if(!settings.island||!p){el.classList.add("hidden");return}
  const u=urgency(p);el.innerHTML=`<img src="${ART[artState(u)]}"><strong>${esc(p.title)}</strong><span>${remainWords(new Date(p.deadline)-Date.now())}</span>`;el.classList.remove("hidden")
}
function maybeDanger(force=false){
  const p=primary(),s=$("#dangerScreen");if(!p||!settings.danger){s.classList.add("hidden");return}
  const u=urgency(p);if(!force&&!["danger","overdue"].includes(u)){s.classList.add("hidden");return}
  if(!force&&focusId===p.id){s.classList.add("hidden");return}
  const key="dangerSeen."+p.id+"."+new Date(p.deadline).getTime();if(!force&&sessionStorage.getItem(key))return;sessionStorage.setItem(key,"1");
  $("#dangerArt").src=ART.danger;$("#dangerTitle").textContent=p.title;$("#dangerMeta").textContent=`${dateText(p.deadline)} 截止 · 还有 ${remainWords(new Date(p.deadline)-Date.now())}`;
  $("#dangerStart").onclick=()=>{s.classList.add("hidden");startFocus(p.id)};
  $("#dangerLater").onclick=()=>{p.snoozeUntil=new Date(Date.now()+15*60000).toISOString();saveTasks();s.classList.add("hidden");render()};
  s.classList.remove("hidden");
}
function render(){
  renderNow();renderToday();renderFocus();renderIsland();$("#brandMascot").src=ART.calm;$("#doneArt").src=ART.done;
  $("#islandSwitch").checked=settings.island;$("#dangerSwitch").checked=settings.danger;
}
function switchView(id){$$(".view").forEach(v=>v.classList.toggle("active",v.id===id));$$(".tab").forEach(t=>t.classList.toggle("active",t.dataset.view===id));render()}
function startFocus(id){focusId=id;let t=tasks.find(x=>x.id===id);if(t&&!t.startedAt)t.startedAt=new Date().toISOString();saveTasks();$("#dangerScreen").classList.add("hidden");switchView("focus")}
function abandonFocus(){focusId=null;switchView("now")}
function completeTask(id){let t=tasks.find(x=>x.id===id);if(!t)return;t.status="completed";t.completedAt=new Date().toISOString();saveTasks();focusId=null;$("#doneFlash").classList.remove("hidden");setTimeout(()=>{$("#doneFlash").classList.add("hidden");switchView("now")},1150)}
function openModal(){let d=new Date(Date.now()+2*3600000);d.setSeconds(0,0);$("#deadlineInput").value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);$("#taskModal").classList.remove("hidden")}
function closeModal(){$("#taskModal").classList.add("hidden")}

$("#addBtn").onclick=openModal;$("#addBtn2").onclick=openModal;$("#closeModal").onclick=closeModal;
$("#taskModal").addEventListener("click",e=>{if(e.target.id==="taskModal")closeModal()});
$("#taskForm").onsubmit=e=>{e.preventDefault();tasks.push({id:crypto.randomUUID(),title:$("#titleInput").value.trim(),deadline:new Date($("#deadlineInput").value).toISOString(),duration:Number($("#durationInput").value),category:$("#categoryInput").value,priority:$("#priorityInput").value,status:"active",startedAt:null,snoozeUntil:null});saveTasks();e.target.reset();$("#durationInput").value=45;closeModal();switchView("now")};
$$(".tab").forEach(t=>t.onclick=()=>switchView(t.dataset.view));
$("#islandSwitch").onchange=e=>{settings.island=e.target.checked;saveSettings();render()};
$("#dangerSwitch").onchange=e=>{settings.danger=e.target.checked;saveSettings();render()};
$("#demoDanger").onclick=()=>maybeDanger(true);$("#seedBtn").onclick=seed;
setInterval(()=>{render();maybeDanger(false)},1000);render();
</script>
</body></html>
