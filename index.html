<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7fbff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小待">
<title>小待 Dodo Lite V4</title>
<style>
:root{
  --bg:#f5f9fd; --ink:#102b4c; --muted:#7f91a8; --line:#e6edf4;
  --green:#51c58b; --blue:#6fb2ff; --orange:#ffad5d; --red:#ff6268;
  --card:#fff; --shadow:0 18px 50px rgba(43,77,112,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Segoe UI",sans-serif;background:linear-gradient(180deg,#f8fbff,#f2f7fb);color:var(--ink)}
body{overflow-x:hidden}
button,input,select{font:inherit}button{cursor:pointer}
#app{
  width:min(100%,520px); min-height:100vh; margin:auto;
  padding:calc(67px + env(safe-area-inset-top)) 16px calc(108px + env(safe-area-inset-bottom));
}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand-dodo{width:43px;height:43px;display:grid;place-items:center}
.brand-title{font-size:21px;font-weight:860;letter-spacing:-.03em}
.brand-title small{font-size:13px;color:#72859b;font-weight:700}
.round-btn{width:44px;height:44px;border:0;border-radius:50%;background:#fff;color:#153957;font-size:27px;box-shadow:0 8px 24px rgba(37,72,106,.1)}
.view{display:none}.view.active{display:block}

/* APPROVED DODO ART */
.dodo-actor{
  display:block; position:relative; transform-origin:50% 82%;
  will-change:transform,filter; user-select:none; pointer-events:none;
}
.dodo-actor img{
  display:block;width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 12px 14px rgba(53,75,91,.13));
}
.dodo-actor .blink{
  display:none;position:absolute;left:50%;top:47%;
  width:36%;height:11%;transform:translate(-50%,-50%);
  pointer-events:none;
}
.dodo-actor.blinking .blink{display:block}
.blink:before,.blink:after{
  content:"";position:absolute;top:48%;width:23%;height:4px;
  border-radius:99px;background:#241d1d;
}
.blink:before{left:8%;transform:rotate(2deg)}
.blink:after{right:8%;transform:rotate(-2deg)}
.dodo-actor.done.pop-in{animation:dodoDoneEntrance .85s cubic-bezier(.2,.8,.2,1) both}
@keyframes dodoDoneEntrance{
  0%{transform:translateY(15px) scale(.82);opacity:0}
  55%{transform:translateY(-14px) scale(1.06);opacity:1}
  78%{transform:translateY(3px) scale(.985)}
  100%{transform:none}
}

/* NOW */
.hero{background:linear-gradient(180deg,#eafaff,#faffff);border-radius:32px;padding:16px;box-shadow:var(--shadow)}
.dodo-stage{
  position:relative;display:grid;place-items:center;min-height:260px;
  border-radius:26px;overflow:hidden;
  background:radial-gradient(circle at 50% 26%,#fff 0 18%,#ecfaff 52%,#e5f8ee 100%);
}
.dodo-stage:before,.dodo-stage:after{
  content:"";position:absolute;bottom:-28px;width:190px;height:88px;
  border-radius:50% 50% 0 0;background:#caefdf;opacity:.78
}
.dodo-stage:before{left:-50px}
.dodo-stage:after{right:-50px;background:#d6eeff}
.whisper{position:absolute;right:16px;top:16px;color:#7595b0;font-size:12px;line-height:1.55;transform:rotate(-4deg);z-index:4}
.task-card{
  position:relative;z-index:5;margin-top:-31px;background:rgba(255,255,255,.97);
  border-radius:27px;padding:20px;box-shadow:0 13px 35px rgba(45,78,110,.10)
}
.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#e7f8ee;color:#31966a;font-size:12px;font-weight:820}
.task-title{font-size:28px;line-height:1.08;letter-spacing:-.045em;margin:12px 0 8px}
.meta{font-size:13px;color:var(--muted)}
.remain{margin:18px 0;text-align:center;color:#61778e}
.remain strong{font-size:36px;letter-spacing:-.055em;color:#102e50}
.primary,.secondary{border:0;border-radius:18px;padding:15px 18px;font-weight:850}
.primary{background:linear-gradient(90deg,#43c483,#5fd093);color:#fff;box-shadow:0 8px 20px rgba(74,196,136,.18)}
.secondary{background:#edf4fa;color:#274663}
.wide{width:100%}
.quote{text-align:center;color:#70869f;font-size:13px;line-height:1.7;padding:15px 16px 2px}

/* TODAY */
.section-title{display:flex;align-items:center;justify-content:space-between;margin:10px 2px 14px}
.section-title h2{font-size:30px;letter-spacing:-.04em;margin:0}
.filters{display:flex;gap:7px;overflow:auto;margin-bottom:12px}
.filter{border:0;border-radius:12px;padding:8px 12px;background:#edf3f8;color:#74879d;font-weight:760;font-size:13px;white-space:nowrap}
.filter.active{background:#6dAeff;color:#fff}
.stack{display:grid;gap:9px}
.task-row{
  display:grid;grid-template-columns:58px 1fr 38px;gap:11px;align-items:center;
  background:#fff;border:1px solid #edf2f6;border-radius:20px;padding:10px 11px;
  box-shadow:0 5px 17px rgba(37,70,103,.05)
}
.task-icon{width:56px;height:56px;border-radius:15px;background:#f3f9fd;display:grid;place-items:center;overflow:hidden}
.task-row strong{display:block;font-size:15px}.sub{font-size:12px;color:#8a98aa;margin-top:4px}
.play{width:34px;height:34px;border:0;border-radius:50%;background:#eaf4ff;color:#5a9fe9;font-weight:900}

/* FOCUS - all normal flow, no overlap */
.focus-card{
  background:linear-gradient(180deg,#fff8df,#fffdfa);border-radius:31px;padding:20px 16px 24px;
  box-shadow:var(--shadow);text-align:center;min-height:min(700px,calc(100vh - 205px));
  display:flex;flex-direction:column;align-items:center
}
.focus-title{font-size:18px;font-weight:850}
.focus-stage{height:205px;width:100%;display:grid;place-items:center;margin-top:5px}
.ring{
  width:min(71vw,288px);aspect-ratio:1;border-radius:50%;
  background:conic-gradient(#f8ad51 var(--progress,8%),#f7e7bf 0);
  padding:12px;display:grid;place-items:center;margin-top:2px
}
.ring-inner{width:100%;height:100%;border-radius:50%;background:#fffdfa;display:grid;place-items:center}
.focus-time{font-size:clamp(43px,13vw,58px);font-weight:900;letter-spacing:-.06em}
.focus-actions{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:12px;width:100%;margin-top:23px}
.circle-action{height:58px;border:0;border-radius:50%;background:#f5f1e8;color:#5c543f;font-size:22px}
.circle-action.main{background:#ffad5d;color:white}

/* SETTINGS */
.setting-card{background:#fff;border-radius:22px;padding:6px 15px;margin:12px 0;box-shadow:0 7px 23px rgba(35,70,105,.06)}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border-bottom:0}
.switch input{display:none}.switch span{display:block;width:48px;height:28px;border-radius:99px;background:#dce5ed;position:relative}
.switch span:after{content:"";position:absolute;width:22px;height:22px;top:3px;left:3px;background:white;border-radius:50%;box-shadow:0 2px 7px rgba(0,0,0,.15);transition:.2s}
.switch input:checked+span{background:#55c98b}.switch input:checked+span:after{left:23px}
.character-lab{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 0 6px}
.char-btn{border:0;border-radius:14px;background:#f5f8fb;padding:7px 2px;font-size:10px;color:#72849a}
.char-btn.active{outline:2px solid #78b6f0;background:#eef8ff}
.preview-box{height:210px;display:grid;place-items:center;background:linear-gradient(180deg,#f9fcff,#f4f9fc);border-radius:20px;margin:8px 0 12px}

/* TAB */
.tabbar{
  position:fixed;z-index:40;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));
  transform:translateX(-50%);width:min(calc(100% - 24px),496px);
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:7px;
  background:rgba(255,255,255,.93);backdrop-filter:blur(19px);
  border-radius:25px;box-shadow:0 17px 45px rgba(35,70,105,.15)
}
.tab{border:0;background:transparent;border-radius:18px;padding:11px 4px;color:#98a6b7;font-weight:800}
.tab.active{color:#4f9fe7;background:#eef7ff}

/* SIMULATED ISLAND */
.island{
  position:fixed;z-index:50;left:50%;top:calc(10px + env(safe-area-inset-top));
  transform:translateX(-50%);height:43px;width:min(80vw,338px);
  border-radius:24px;background:#050505;color:#fff;padding:0 13px;
  display:flex;align-items:center;gap:9px;box-shadow:0 8px 25px rgba(0,0,0,.2);font-size:12px
}
.island.hidden{display:none}.island-mini{width:31px;height:31px;display:grid;place-items:center;flex:0 0 auto}
.island strong{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.island span{white-space:nowrap}

/* MODALS */
.modal,.danger-screen{
  position:fixed;z-index:80;inset:0;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(22,39,57,.26);backdrop-filter:blur(11px)
}
.hidden{display:none!important}
.sheet{
  width:min(100%,520px);max-height:90vh;overflow:auto;background:#fff;border-radius:32px 32px 0 0;
  padding:11px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -18px 60px rgba(22,42,60,.17)
}
.handle{width:42px;height:5px;border-radius:10px;background:#dbe3ea;margin:0 auto 12px}
.form{display:grid;gap:15px}.form label{display:grid;gap:7px;font-size:13px;font-weight:800}
.form input,.form select{width:100%;border:1px solid #e3ebf2;background:#fafcfe;border-radius:14px;padding:13px}

/* DANGER */
.danger-screen{align-items:stretch;background:linear-gradient(180deg,#ffd2d5,#ffe8e8)}
.danger-content{
  width:min(100%,520px);margin:auto;padding:calc(72px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));
  text-align:center;color:#552c32
}
.danger-content h2{font-size:31px;letter-spacing:-.04em;margin:9px 0 5px}
.danger-task{background:rgba(255,255,255,.78);border-radius:21px;padding:15px;text-align:left;margin:20px 0}
.danger-actions{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}
.danger-main{border:0;border-radius:18px;padding:15px;background:#ff6268;color:#fff;font-weight:900}
.danger-later{border:0;border-radius:18px;padding:15px;background:#fff;color:#68565a;font-weight:800}

/* DONE */
.done-flash{position:fixed;z-index:100;inset:0;background:rgba(238,255,244,.97);display:grid;place-items:center;text-align:center}
.done-flash h2{font-size:33px;margin:10px 0 4px}
.empty{background:#fff;border-radius:26px;padding:38px 18px;text-align:center;color:#7c8da0}

/* SMALLER IPHONES */
@media (max-height:760px){
  #app{padding-top:calc(61px + env(safe-area-inset-top))}
  .dodo-stage{min-height:225px}.task-card{margin-top:-24px}
  .focus-stage{height:165px}.ring{width:min(61vw,245px)}
  .focus-actions{margin-top:15px}
}
@media (max-width:360px){
  #app{padding-left:12px;padding-right:12px}
  .task-title{font-size:25px}.remain strong{font-size:32px}
}
@media (prefers-reduced-motion:reduce){
  .dodo-actor{transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="brand"><div id="brandDodo" class="brand-dodo"></div><div class="brand-title">小待 <small>Dodo Lite V4</small></div></div>
    <button class="round-btn" id="addTask">＋</button>
  </div>
  <main>
    <section class="view active" id="now"><div id="nowRoot"></div></section>
    <section class="view" id="today">
      <div class="section-title"><h2>今天</h2><button class="round-btn" id="addTask2">＋</button></div>
      <div class="filters"><button class="filter active">全部</button><button class="filter">学习</button><button class="filter">工作</button><button class="filter">生活</button></div>
      <div class="stack" id="todayList"></div>
    </section>
    <section class="view" id="focus"><div id="focusRoot"></div></section>
    <section class="view" id="settings">
      <div class="section-title"><h2>设置</h2></div>
      <div class="setting-card">
        <div class="setting-row"><div><strong>模拟灵动岛</strong><div class="meta">展示当前任务状态</div></div><label class="switch"><input id="toggleIsland" type="checkbox" checked><span></span></label></div>
        <div class="setting-row"><div><strong>模拟重要提醒</strong><div class="meta">Danger 时显示全屏提醒</div></div><label class="switch"><input id="toggleDanger" type="checkbox" checked><span></span></label></div>
      </div>

      <div class="setting-card" style="padding:14px 15px 16px">
        <strong>角色实验室</strong>
        <div class="meta" style="margin-top:3px">这里可以直接感受五种自然动作。</div>
        <div class="character-lab" id="characterButtons"></div>
        <div class="preview-box"><div id="characterPreview"></div></div>
      </div>

      <div class="setting-card">
        <button class="secondary wide" id="demoDanger">体验 Danger 页面</button>
        <button class="secondary wide" id="resetDemo" style="margin-top:8px">恢复演示任务</button>
      </div>
      <div class="setting-card" style="padding:18px">
        <strong>V4 说明</strong>
        <p class="meta" style="line-height:1.65">角色直接来自你确认的初版海报，不再重新绘制。动画采用随机间隔和非循环节奏，页面也不再每秒重建 Dodo。</p>
      </div>
    </section>
  </main>
</div>

<div id="island" class="island hidden"></div>

<nav class="tabbar">
  <button class="tab active" data-view="now">现在</button>
  <button class="tab" data-view="today">今天</button>
  <button class="tab" data-view="focus">专注</button>
  <button class="tab" data-view="settings">设置</button>
</nav>

<div id="modal" class="modal hidden">
  <div class="sheet"><div class="handle"></div>
    <div style="display:flex;align-items:center;justify-content:space-between"><h2>新建任务</h2><button id="closeModal" class="secondary">取消</button></div>
    <form id="form" class="form">
      <label>做什么？<input id="title" required maxlength="50" placeholder="例如：英语演讲预习"></label>
      <label>截止时间<input id="deadline" type="datetime-local" required></label>
      <label>预计需要多久（分钟）<input id="duration" type="number" min="5" max="720" value="45"></label>
      <label>分类<select id="category"><option>学习</option><option>工作</option><option>生活</option></select></label>
      <label>重要程度<select id="priority"><option value="normal">普通</option><option value="important">重要</option><option value="mustDo">必须完成</option></select></label>
      <button class="primary wide">创建任务</button>
    </form>
  </div>
</div>

<div id="dangerScreen" class="danger-screen hidden">
  <div class="danger-content">
    <div id="dangerDodo" style="display:grid;place-items:center"></div>
    <h2>先完成这件事！</h2><div>时间已经很紧了</div>
    <p style="color:#795c61;line-height:1.6">为了不让重要的事被耽误，先完成当前任务吧。</p>
    <div class="danger-task"><strong id="dangerTitle"></strong><div class="meta" id="dangerMeta"></div></div>
    <div class="danger-actions"><button class="danger-main" id="dangerStart">▶ 立即开始</button><button class="danger-later" id="dangerLater">稍后提醒<br><small>15分钟</small></button></div>
  </div>
</div>

<div id="doneFlash" class="done-flash hidden">
  <div><div id="doneDodo" style="display:grid;place-items:center"></div><h2>完成啦！</h2><div class="meta">重要的事，一件件来。</div></div>
</div>

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const TASKS_KEY="dodo.v4.tasks", SETTINGS_KEY="dodo.v4.settings";
let tasks=readTasks(), focusId=null, settings=readSettings();
let currentView="now", currentPrimarySig="", focusRenderedId=null, previewState="calm";

function readTasks(){try{return JSON.parse(localStorage.getItem(TASKS_KEY)||"[]")}catch(e){return[]}}
function writeTasks(){localStorage.setItem(TASKS_KEY,JSON.stringify(tasks))}
function readSettings(){try{return Object.assign({island:true,danger:true},JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}"))}catch(e){return{island:true,danger:true}}}
function writeSettings(){localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings))}
function id(){return (crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()))}
function makeTask(title,mins,duration,category,priority="normal"){return{id:id(),title,deadline:new Date(Date.now()+mins*60000).toISOString(),duration,category,priority,status:"active",startedAt:null,snoozeUntil:null}}
function seed(){
  tasks=[
    makeTask("英语演讲预习",135,45,"学习","important"),
    makeTask("整理房间",257,35,"生活"),
    makeTask("项目方案修改",1500,60,"工作","important"),
    makeTask("阅读 30 分钟",370,30,"生活"),
    Object.assign(makeTask("买生日礼物",520,20,"生活"),{status:"completed"})
  ];
  writeTasks();
}
if(!tasks.length)seed();

function mult(p){return p==="mustDo"?1.25:p==="important"?1.15:1}
function urgency(t,now=Date.now()){
  if(t.status==="completed")return"done";
  if(t.snoozeUntil&&new Date(t.snoozeUntil).getTime()>now)return"calm";
  const left=(new Date(t.deadline).getTime()-now)/1000;
  if(left<=0)return"overdue";
  const d=Math.max(t.duration*60,60),m=mult(t.priority);
  if(left<=Math.max(d*1.1,900)*m)return"danger";
  if(left<=Math.max(d*1.75,1800)*m)return"urgent";
  if(left<=Math.max(d*2.5,3600)*m)return"notice";
  return"calm";
}
const ranks={done:-1,calm:0,notice:1,urgent:2,danger:3,overdue:4};
function risk(t){return(new Date(t.deadline)-Date.now())/Math.max(t.duration*60000,60000)}
function primary(){
  return tasks.filter(t=>t.status!=="completed").sort((a,b)=>{
    let ua=urgency(a),ub=urgency(b);
    if(ranks[ua]!==ranks[ub])return ranks[ub]-ranks[ua];
    if(mult(a.priority)!==mult(b.priority))return mult(b.priority)-mult(a.priority);
    return risk(a)-risk(b);
  })[0]||null;
}
function artState(s){return s==="overdue"?"danger":s}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function when(d){return new Date(d).toLocaleString("zh-CN",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}
function words(ms){let neg=ms<0;ms=Math.abs(ms);let min=Math.floor(ms/60000),h=Math.floor(min/60),m=min%60;return`${neg?"超时 ":""}${h?h+"小时 ":""}${m}分钟`}
function clock(ms){let neg=ms<0;ms=Math.abs(ms);let sec=Math.floor(ms/1000),h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return`${neg?"-":""}${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}

/* Approved raster + organic animation scheduler.
   Animations are short, irregular and settle back to stillness. */
function dodoHTML(state,size=200,idSuffix=""){
  state=artState(state);
  return `<div class="dodo-actor ${state}" data-dodo="${state}" id="dodo_${idSuffix}_${Math.random().toString(36).slice(2)}" style="width:${size}px;height:${size}px"><img src="${ART[state]}" alt="小待 ${state}"><div class="blink"></div></div>`;
}
function scheduleDodo(actor){
  if(!actor || actor.dataset.motionBound)return;
  actor.dataset.motionBound="1";
  const state=actor.dataset.dodo;
  const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduced)return;

  function later(fn,min,max){
    const delay=min+Math.random()*(max-min);
    actor._motionTimer=setTimeout(()=>{if(document.body.contains(actor))fn()},delay);
  }
  function animate(frames,opts,nextMin,nextMax){
    const a=actor.animate(frames,Object.assign({fill:"none",easing:"cubic-bezier(.22,.72,.22,1)"},opts));
    a.onfinish=()=>later(loop,nextMin,nextMax);
  }
  function blink(){
    if(!document.body.contains(actor))return;
    actor.classList.add("blinking");
    setTimeout(()=>actor.classList.remove("blinking"),115);
  }
  function loop(){
    if(!document.body.contains(actor))return;
    if(state==="calm"){
      if(Math.random()<.38)blink();
      animate(
        [{transform:"translateY(0) scale(1)"},{transform:"translateY(-2px) scale(1.008,.996)",offset:.46},{transform:"translateY(-4px) rotate(.35deg) scale(1.004,1.007)",offset:.72},{transform:"translateY(0) scale(1)"}],
        {duration:3000+Math.random()*900},1200,3000
      );
    }else if(state==="notice"){
      if(Math.random()<.28)blink();
      animate(
        [{transform:"translateY(0) rotate(0)"},{transform:"translateY(-4px) rotate(-1.1deg)",offset:.32},{transform:"translateY(-3px) rotate(1.5deg)",offset:.56},{transform:"translateY(-2px) rotate(-.7deg)",offset:.76},{transform:"none"}],
        {duration:1500+Math.random()*450},2300,4600
      );
    }else if(state==="urgent"){
      if(Math.random()<.22)blink();
      animate(
        [{transform:"none"},{transform:"translateY(-2px) rotate(-.55deg)",offset:.30},{transform:"translateY(0) rotate(.7deg)",offset:.48},{transform:"translateY(-1px) rotate(-.35deg)",offset:.68},{transform:"none"}],
        {duration:1250+Math.random()*300},1700,3300
      );
    }else if(state==="danger"){
      animate(
        [{transform:"none",filter:"drop-shadow(0 12px 14px rgba(53,75,91,.13))"},{transform:"translateY(-3px) scale(1.022)",filter:"drop-shadow(0 17px 19px rgba(210,67,74,.18))",offset:.34},{transform:"translateY(-1px) rotate(-.8deg) scale(1.012)",offset:.55},{transform:"translateY(-2px) rotate(.7deg) scale(1.015)",offset:.7},{transform:"none"}],
        {duration:980+Math.random()*220},1300,2500
      );
    }else if(state==="done"){
      animate(
        [{transform:"translateY(0) scale(1)"},{transform:"translateY(-13px) scale(1.04)",offset:.30},{transform:"translateY(3px) scale(.99)",offset:.62},{transform:"translateY(-3px) scale(1.01)",offset:.78},{transform:"none"}],
        {duration:950},4200,7000
      );
    }
  }
  later(loop,350,1000);
}
function bindDodos(scope=document){
  scope.querySelectorAll(".dodo-actor").forEach(scheduleDodo);
}

function renderBrand(){

}
function renderNow(force=false){
  const p=primary(),root=$("#nowRoot");
  const sig=p?`${p.id}:${urgency(p)}`:"none";
  if(!force && root.dataset.sig===sig)return;
  root.dataset.sig=sig;
  if(!p){
    root.innerHTML=`<div class="empty">${dodoHTML("calm",190,"empty")}<h2>今天暂时没有事情</h2><p>有新的任务时，小待会帮你看着时间。</p></div>`;
    bindDodos(root);return;
  }
  const u=urgency(p);
  root.innerHTML=`<div class="hero"><div class="dodo-stage"><div class="whisper">${u==="calm"?"慢下来，<br>一切都会变好。":u==="notice"?"差不多可以<br>开始啦 ♡":u==="urgent"?"时间不多了，<br>现在开始比较稳。":"先做这件事。"} </div>${dodoHTML(u,222,"now")}</div><div class="task-card"><span class="tag">${p.category}</span><div class="task-title">${esc(p.title)}</div><div class="meta">◷ ${when(p.deadline)} 截止 · 预计 ${p.duration} 分钟</div><div class="remain">还有 <strong data-left-for="${p.id}">${words(new Date(p.deadline)-Date.now())}</strong></div><button class="primary wide" onclick="startFocus('${p.id}')">▶ 开始任务</button></div><div class="quote">“每一个小小的开始，<br>都会让你更靠近想要的自己。”</div></div>`;
  bindDodos(root);
}
function renderToday(force=false){
  const root=$("#todayList");
  const sig=tasks.map(t=>`${t.id}:${t.status}:${urgency(t)}`).join("|");
  if(!force&&root.dataset.sig===sig)return;
  root.dataset.sig=sig;
  root.innerHTML=tasks.slice().sort((a,b)=>new Date(a.deadline)-new Date(b.deadline)).map(t=>{
    const u=urgency(t);
    return `<div class="task-row" style="${t.status==="completed"?"opacity:.55":""}"><div class="task-icon">${dodoHTML(u,54,"row")}</div><div><strong>${esc(t.title)}</strong><div class="sub">${t.status==="completed"?"已完成":when(t.deadline)} · ${t.category}</div></div><button class="play" ${t.status==="completed"?"disabled":`onclick="startFocus('${t.id}')"`}>${t.status==="completed"?"✓":"▶"}</button></div>`;
  }).join("");
  bindDodos(root);
}
function renderFocus(force=false){
  const t=tasks.find(x=>x.id===focusId&&x.status!=="completed"),root=$("#focusRoot");

    if(root.dataset.sig==="none"&&!force)return;
    root.dataset.sig="none";

  if(!t.startedAt)t.startedAt=new Date().toISOString();

  if(!force&&root.dataset.sig===sig)return;
  root.dataset.sig=sig;
  root.innerHTML=`<div class="focus-card"><div class="focus-title">专注中</div><div class="meta">${esc(t.title)} · ${t.category}</div><div class="focus-stage">${dodoHTML("urgent",185,"focus")}</div><div class="ring" id="focusRing"><div class="ring-inner"><div><div class="focus-time" id="focusTimer">00:00:00</div><div class="meta">专注进行中</div><div style="margin-top:8px;color:#9b7d51">你可以的！♡</div></div></div></div><div class="focus-actions"><button class="circle-action" onclick="leaveFocus()">×</button><button class="circle-action main">Ⅱ</button><button class="circle-action" onclick="completeTask('${t.id}')">✓</button></div></div>`;
  bindDodos(root);
}
function renderIsland(force=false){
  const p=primary(),el=$("#island");

function renderCharacterLab(){

  renderNow(force);renderToday(force);renderFocus(force);renderIsland(force);
  if(currentView==="settings")renderSettings();
}
function updateClocks(){
  const p=primary();
  if(p){
    document.querySelectorAll(`[data-left-for="${p.id}"]`).forEach(el=>el.textContent=words(new Date(p.deadline)-Date.now()));
    const ir=$("#islandRemain");if(ir)ir.textContent=words(new Date(p.deadline)-Date.now());
  }
  const t=tasks.find(x=>x.id===focusId&&x.status!=="completed");
  if(t&&t.startedAt){
    const duration=t.duration*60000,end=new Date(t.startedAt).getTime()+duration,left=end-Date.now();
    const timer=$("#focusTimer"),ring=$("#focusRing");
    if(timer)timer.textContent=clock(left);
    if(ring){
      const pct=Math.max(8,Math.min(100,(1-left/duration)*100));
      ring.style.setProperty("--progress",`${pct}%`);
    }
  }
}
function maybeDanger(force=false){
  const p=primary(),screen=$("#dangerScreen");
  if(!p||!settings.danger){screen.classList.add("hidden");return}
  const u=urgency(p);
  if(!force&&!["danger","overdue"].includes(u)){screen.classList.add("hidden");return}
  if(!force&&focusId===p.id){screen.classList.add("hidden");return}
  const key="v4danger."+p.id+"."+new Date(p.deadline).getTime();
  if(!force&&sessionStorage.getItem(key))return;
  sessionStorage.setItem(key,"1");
  $("#dangerDodo").innerHTML=dodoHTML("danger",238,"danger");
  bindDodos($("#dangerDodo"));
  $("#dangerTitle").textContent=p.title;
  $("#dangerMeta").textContent=`${when(p.deadline)} 截止 · 还有 ${words(new Date(p.deadline)-Date.now())}`;
  $("#dangerStart").onclick=()=>{screen.classList.add("hidden");startFocus(p.id)};
  $("#dangerLater").onclick=()=>{p.snoozeUntil=new Date(Date.now()+15*60000).toISOString();writeTasks();screen.classList.add("hidden");renderAll(true)};
  screen.classList.remove("hidden");
}
function switchView(id){
  currentView=id;
  $$(".view").forEach(v=>v.classList.toggle("active",v.id===id));
  $$(".tab").forEach(b=>b.classList.toggle("active",b.dataset.view===id));
  renderAll(true);updateClocks();
}
function startFocus(id){
  focusId=id;const t=tasks.find(x=>x.id===id);
  if(t&&!t.startedAt)t.startedAt=new Date().toISOString();
  writeTasks();$("#dangerScreen").classList.add("hidden");switchView("focus");
}
function leaveFocus(){focusId=null;switchView("now")}
function completeTask(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  t.status="completed";t.completedAt=new Date().toISOString();writeTasks();focusId=null;
  $("#doneDodo").innerHTML=dodoHTML("done",245,"done");bindDodos($("#doneDodo"));
  $("#doneFlash").classList.remove("hidden");
  setTimeout(()=>{$("#doneFlash").classList.add("hidden");switchView("now")},1450);
}
function openModal(){
  const d=new Date(Date.now()+2*3600000);d.setSeconds(0,0);
  $("#deadline").value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
  $("#modal").classList.remove("hidden")
}
function closeModal(){$("#modal").classList.add("hidden")}

$("#addTask").onclick=openModal;$("#addTask2").onclick=openModal;$("#closeModal").onclick=closeModal;
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
$("#form").onsubmit=e=>{
  e.preventDefault();
  tasks.push({id:id(),title:$("#title").value.trim(),deadline:new Date($("#deadline").value).toISOString(),duration:Number($("#duration").value),category:$("#category").value,priority:$("#priority").value,status:"active",startedAt:null,snoozeUntil:null});
  writeTasks();e.target.reset();$("#duration").value=45;closeModal();renderAll(true);updateClocks();
};
$$(".tab").forEach(b=>b.onclick=()=>switchView(b.dataset.view));
$("#toggleIsland").onchange=e=>{settings.island=e.target.checked;writeSettings();renderIsland(true)};
$("#toggleDanger").onchange=e=>{settings.danger=e.target.checked;writeSettings()};
$("#demoDanger").onclick=()=>maybeDanger(true);
$("#resetDemo").onclick=()=>{seed();focusId=null;renderAll(true);updateClocks()};

renderBrand();
renderAll(true);
updateClocks();

/* Only clocks update every second. Character DOM stays alive, so motions feel continuous. */
let lastStateCheck="";
setInterval(()=>{
  updateClocks();
  const p=primary();
  const sig=p?`${p.id}:${urgency(p)}`:"none";
  if(sig!==lastStateCheck){
    lastStateCheck=sig;renderNow(true);renderToday(true);renderIsland(true);updateClocks();
  }
  maybeDanger(false);
},1000);
</script>
</body></html>
