<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7fbff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小待">
<title>小待 Dodo Lite V4.1</title>
<style>
:root{
  --bg:#f4f8fc;
  --card:#ffffff;
  --ink:#142d4f;
  --muted:#8091a4;
  --line:#e7eef5;
  --green:#53c788;
  --green2:#75d79e;
  --blue:#8fc1ff;
  --notice:#f5db82;
  --urgent:#ffb56a;
  --danger:#ff6a72;
  --shadow:0 18px 46px rgba(40,74,108,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#f9fcff 0%, #f2f7fb 100%);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Segoe UI",sans-serif;color:var(--ink)}
body{overflow-x:hidden}
button,input,select{font:inherit}
button{cursor:pointer}
#app{width:min(100%,520px);margin:auto;min-height:100vh;padding:calc(68px + env(safe-area-inset-top)) 16px calc(108px + env(safe-area-inset-bottom))}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brandTitle{font-size:21px;font-weight:860;letter-spacing:-.03em}
.brandTitle small{font-size:13px;font-weight:700;color:#77889e}
.roundBtn{border:0;background:#fff;width:46px;height:46px;border-radius:50%;font-size:29px;color:#163758;box-shadow:0 8px 24px rgba(39,73,107,.11)}
.view{display:none} .view.active{display:block}
.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 14px}
.sectionTitle h2{margin:0;font-size:30px;letter-spacing:-.04em}

.dodo{
  position:relative;display:block;transform-origin:50% 82%;
  will-change:transform,filter;user-select:none;pointer-events:none;
}
.dodo img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(57,82,99,.15))}
.dodo .blink{display:none;position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);width:36%;height:10%;pointer-events:none}
.dodo.blinking .blink{display:block}
.dodo .blink:before,.dodo .blink:after{content:"";position:absolute;top:50%;width:23%;height:4px;border-radius:99px;background:#1e1a1a}
.dodo .blink:before{left:8%;transform:rotate(2deg)}
.dodo .blink:after{right:8%;transform:rotate(-2deg)}
.dodo.wrap-done:after{
  content:"";position:absolute;inset:10% 10% auto auto;width:28px;height:28px;border-radius:50%;
  background:radial-gradient(circle,#ffe986 10%, rgba(255,233,134,.55) 42%, rgba(255,233,134,0) 72%);
  opacity:0;transform:scale(.6)
}
.dodo.spark:after{animation:sparkPulse .8s ease-out}
@keyframes sparkPulse{0%{opacity:0;transform:scale(.4)}20%{opacity:1}100%{opacity:0;transform:scale(1.25)}}

.hero{background:linear-gradient(180deg,#eefbff,#fbffff);border-radius:34px;padding:16px;box-shadow:var(--shadow)}
.stage{position:relative;min-height:272px;display:grid;place-items:center;overflow:hidden;border-radius:28px;background:radial-gradient(circle at 50% 26%,#fff 0 18%,#edfaff 52%,#e7f9ef 100%)}
.stage:before,.stage:after{content:"";position:absolute;bottom:-26px;width:210px;height:94px;border-radius:50% 50% 0 0;background:#caeedc;opacity:.78}
.stage:before{left:-52px}
.stage:after{right:-52px;background:#d7eeff}
.whisper{position:absolute;right:16px;top:15px;color:#7894ad;font-size:12px;line-height:1.56;transform:rotate(-4deg);z-index:3}
.card{position:relative;z-index:4;margin-top:-30px;background:rgba(255,255,255,.98);border-radius:28px;padding:20px;box-shadow:0 13px 36px rgba(43,76,111,.10)}
.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#e7f7ef;color:#32986c;font-size:12px;font-weight:820}
.title{font-size:29px;line-height:1.08;letter-spacing:-.045em;margin:12px 0 8px}
.meta{font-size:13px;color:var(--muted)}
.remain{text-align:center;margin:18px 0;color:#647a90}
.remain strong{font-size:37px;color:#103155;letter-spacing:-.06em}
.primary,.secondary{border:0;border-radius:18px;padding:15px 18px;font-weight:860}
.primary{background:linear-gradient(90deg,#46c684,#62d193);color:#fff;box-shadow:0 8px 20px rgba(76,197,137,.18)}
.secondary{background:#edf4fa;color:#294663}
.wide{width:100%}
.quote{text-align:center;color:#7388a0;font-size:13px;line-height:1.72;padding:16px 12px 2px}

.filters{display:flex;gap:7px;overflow:auto;margin-bottom:12px}
.filter{border:0;background:#edf3f8;border-radius:12px;padding:8px 12px;color:#75879d;font-weight:760;font-size:13px;white-space:nowrap}
.filter.active{background:#6eaeff;color:#fff}
.stack{display:grid;gap:9px}
.taskRow{display:grid;grid-template-columns:58px 1fr 38px;gap:11px;align-items:center;background:#fff;border:1px solid #edf2f6;border-radius:20px;padding:10px 11px;box-shadow:0 5px 17px rgba(37,70,103,.05)}
.taskIcon{width:56px;height:56px;border-radius:16px;background:#f5f9fd;display:grid;place-items:center;overflow:hidden}
.taskRow strong{display:block;font-size:15px}
.sub{font-size:12px;color:#8a98aa;margin-top:4px}
.play{border:0;width:34px;height:34px;border-radius:50%;background:#eaf4ff;color:#5a9fe9;font-size:16px;font-weight:900}

.focusCard{background:linear-gradient(180deg,#fff9e3,#fffefa);border-radius:31px;padding:20px 16px 24px;box-shadow:var(--shadow);text-align:center;min-height:min(700px,calc(100vh - 205px));display:flex;flex-direction:column;align-items:center}
.focusTitle{font-size:18px;font-weight:850}
.focusStage{height:212px;width:100%;display:grid;place-items:center;margin-top:5px}
.ring{width:min(72vw,292px);aspect-ratio:1;border-radius:50%;padding:12px;display:grid;place-items:center;background:conic-gradient(var(--urgent) var(--progress,8%), #f7eac4 0);margin-top:4px}
.ringInner{width:100%;height:100%;border-radius:50%;background:#fffdfa;display:grid;place-items:center}
.focusTime{font-size:clamp(43px,13vw,58px);font-weight:900;letter-spacing:-.06em}
.focusActions{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:12px;width:100%;margin-top:22px}
.circleBtn{height:58px;border:0;border-radius:50%;background:#f4efe4;color:#5e5742;font-size:22px}
.circleBtn.main{background:var(--urgent);color:#fff}

.settingCard{background:#fff;border-radius:22px;padding:6px 15px;margin:12px 0;box-shadow:0 7px 23px rgba(35,70,105,.06)}
.settingRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.settingRow:last-child{border-bottom:0}
.switch input{display:none}
.switch span{display:block;width:48px;height:28px;border-radius:99px;background:#dce5ed;position:relative}
.switch span:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 7px rgba(0,0,0,.15);transition:.2s}
.switch input:checked+span{background:#57ca8c}
.switch input:checked+span:after{left:23px}
.charGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 0 6px}
.charBtn{border:0;border-radius:14px;background:#f5f8fb;padding:7px 2px;font-size:10px;color:#72849a}
.charBtn.active{outline:2px solid #78b6f0;background:#eef8ff}
.previewBox{height:222px;display:grid;place-items:center;background:linear-gradient(180deg,#f9fcff,#f4f9fc);border-radius:20px;margin:8px 0 12px}

.tabbar{position:fixed;z-index:40;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 24px),496px);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:7px;background:rgba(255,255,255,.93);backdrop-filter:blur(19px);border-radius:25px;box-shadow:0 17px 45px rgba(35,70,105,.15)}
.tab{border:0;background:transparent;border-radius:18px;padding:11px 4px;color:#98a6b7;font-weight:800}
.tab.active{color:#4f9fe7;background:#eef7ff}

.island{position:fixed;z-index:50;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);height:44px;width:min(82vw,340px);border-radius:24px;background:#050505;color:#fff;padding:0 13px;display:flex;align-items:center;gap:9px;box-shadow:0 8px 25px rgba(0,0,0,.2);font-size:12px}
.island.hidden{display:none}
.islandMini{width:32px;height:32px;display:grid;place-items:center;flex:0 0 auto}
.island strong{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.island span{white-space:nowrap}

.modal,.dangerScreen{position:fixed;z-index:80;inset:0;display:flex;align-items:flex-end;justify-content:center;background:rgba(22,39,57,.26);backdrop-filter:blur(11px)}
.hidden{display:none!important}
.sheet{width:min(100%,520px);max-height:90vh;overflow:auto;background:#fff;border-radius:32px 32px 0 0;padding:11px 20px calc(22px + env(safe-area-inset-bottom));box-shadow:0 -18px 60px rgba(22,42,60,.17)}
.handle{width:42px;height:5px;border-radius:10px;background:#dbe3ea;margin:0 auto 12px}
.form{display:grid;gap:15px}
.form label{display:grid;gap:7px;font-size:13px;font-weight:800}
.form input,.form select{width:100%;border:1px solid #e3ebf2;background:#fafcfe;border-radius:14px;padding:13px}

.dangerScreen{align-items:stretch;background:linear-gradient(180deg,#ffd2d5,#ffe8e8)}
.dangerContent{width:min(100%,520px);margin:auto;padding:calc(72px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));text-align:center;color:#552c32}
.dangerContent h2{font-size:31px;letter-spacing:-.04em;margin:9px 0 5px}
.dangerTask{background:rgba(255,255,255,.78);border-radius:21px;padding:15px;text-align:left;margin:20px 0}
.dangerActions{display:grid;grid-template-columns:1.2fr 1fr;gap:10px}
.dangerMain{border:0;border-radius:18px;padding:15px;background:var(--danger);color:#fff;font-weight:900}
.dangerLater{border:0;border-radius:18px;padding:15px;background:#fff;color:#68565a;font-weight:800}

.doneFlash{position:fixed;z-index:100;inset:0;background:rgba(238,255,244,.97);display:grid;place-items:center;text-align:center}
.doneFlash h2{font-size:33px;margin:10px 0 4px}
.empty{background:#fff;border-radius:26px;padding:38px 18px;text-align:center;color:#7c8da0;box-shadow:0 8px 24px rgba(39,72,106,.06)}

@media (max-height:760px){
  #app{padding-top:calc(61px + env(safe-area-inset-top))}
  .stage{min-height:228px}
  .card{margin-top:-24px}
  .focusStage{height:172px}
  .ring{width:min(63vw,248px)}
  .focusActions{margin-top:15px}
}
@media (max-width:360px){
  #app{padding-left:12px;padding-right:12px}
  .title{font-size:25px}
  .remain strong{font-size:32px}
}
@media (prefers-reduced-motion:reduce){
  .dodo{transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="brand">
      <div id="brandDodo" style="width:43px;height:43px"></div>
      <div class="brandTitle">小待 <small>Dodo Lite V4.1</small></div>
    </div>
    <button class="roundBtn" id="addTask">＋</button>
  </div>

  <main>
    <section class="view active" id="view-now"><div id="nowRoot"></div></section>
    <section class="view" id="view-today">
      <div class="sectionTitle"><h2>今天</h2><button class="roundBtn" id="addTask2">＋</button></div>
      <div class="filters"><button class="filter active">全部</button><button class="filter">学习</button><button class="filter">工作</button><button class="filter">生活</button></div>
      <div class="stack" id="todayList"></div>
    </section>
    <section class="view" id="view-focus"><div id="focusRoot"></div></section>
    <section class="view" id="view-settings">
      <div class="sectionTitle"><h2>设置</h2></div>
      <div class="settingCard">
        <div class="settingRow"><div><strong>模拟灵动岛</strong><div class="meta">展示当前任务状态</div></div><label class="switch"><input id="toggleIsland" type="checkbox" checked><span></span></label></div>
        <div class="settingRow"><div><strong>模拟重要提醒</strong><div class="meta">Danger 时显示全屏提醒</div></div><label class="switch"><input id="toggleDanger" type="checkbox" checked><span></span></label></div>
      </div>

      <div class="settingCard" style="padding:14px 15px 16px">
        <strong>角色实验室</strong>
        <div class="meta" style="margin-top:3px">这版用了更高清素材，并把动作改成更自然的短动作。</div>
        <div class="charGrid" id="charButtons"></div>
        <div class="previewBox"><div id="charPreview"></div></div>
      </div>

      <div class="settingCard">
        <button class="secondary wide" id="demoDanger">体验 Danger 页面</button>
        <button class="secondary wide" id="resetDemo" style="margin-top:8px">恢复演示任务</button>
      </div>

      <div class="settingCard" style="padding:18px">
        <strong>V4.1 说明</strong>
        <p class="meta" style="line-height:1.68">这版重点解决两件事：一是小待更像你认可的海报版，二是动作不再死板。角色素材来自你认可的标准角色图，并做了更高清处理。</p>
      </div>
    </section>
  </main>
</div>

<div id="island" class="island hidden"></div>

<nav class="tabbar">
  <button class="tab active" data-view="now">现在</button>
  <button class="tab" data-view="today">今天</button>
  <button class="tab" data-view="focus">专注</button>
  <button class="tab" data-view="settings">设置</button>
</nav>

<div id="modal" class="modal hidden">
  <div class="sheet">
    <div class="handle"></div>
    <div style="display:flex;align-items:center;justify-content:space-between"><h2>新建任务</h2><button id="closeModal" class="secondary">取消</button></div>
    <form id="form" class="form">
      <label>做什么？<input id="title" required maxlength="50" placeholder="例如：英语演讲预习"></label>
      <label>截止时间<input id="deadline" type="datetime-local" required></label>
      <label>预计需要多久（分钟）<input id="duration" type="number" min="5" max="720" value="45"></label>
      <label>分类<select id="category"><option>学习</option><option>工作</option><option>生活</option></select></label>
      <label>重要程度<select id="priority"><option value="normal">普通</option><option value="important">重要</option><option value="mustDo">必须完成</option></select></label>
      <button class="primary wide">创建任务</button>
    </form>
  </div>
</div>

<div id="dangerScreen" class="dangerScreen hidden">
  <div class="dangerContent">
    <div id="dangerDodo" style="display:grid;place-items:center"></div>
    <h2>先完成这件事！</h2>
    <div>时间已经很紧了</div>
    <p style="color:#795c61;line-height:1.6">为了不让重要的事被耽误，先完成当前任务吧。</p>
    <div class="dangerTask">
      <strong id="dangerTitle"></strong>
      <div class="meta" id="dangerMeta"></div>
    </div>
    <div class="dangerActions">
      <button class="dangerMain" id="dangerStart">▶ 立即开始</button>
      <button class="dangerLater" id="dangerLater">稍后提醒<br><small>15分钟</small></button>
    </div>
  </div>
</div>

<div id="doneFlash" class="doneFlash hidden">
  <div>
    <div id="doneDodo" style="display:grid;place-items:center"></div>
    <h2>完成啦！</h2>
    <div class="meta">重要的事，一件件来。</div>
  </div>
</div>

const $ = s => document.querySelector(s);

const TASKS_KEY = "dodo.v41.tasks";
const SETTINGS_KEY = "dodo.v41.settings";

let tasks = readTasks();
let settings = readSettings();
let focusId = null;
let currentView = "now";
let previewState = "calm";
let lastPrimarySig = "";

function readTasks() {
  try { return JSON.parse(localStorage.getItem(TASKS_KEY) || "[]"); } catch(e) { return []; }
}
function writeTasks() { localStorage.setItem(TASKS_KEY, JSON.stringify(tasks)); }
function readSettings() {
  try { return Object.assign({ island:true, danger:true }, JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}")); }
  catch(e) { return { island:true, danger:true }; }
}
function writeSettings() { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
function uid() { return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random())); }

function createTask(title, mins, duration, category, priority="normal") {
  return {
    id: uid(),
    title,
    deadline: new Date(Date.now() + mins*60000).toISOString(),
    duration,
    category,
    priority,
    status: "active",
    startedAt: null,
    snoozeUntil: null
  };
}

function seed() {
  tasks = [
    createTask("英语演讲预习", 135, 45, "学习", "important"),
    createTask("整理房间", 257, 35, "生活"),
    createTask("项目方案修改", 1500, 60, "工作", "important"),
    createTask("阅读 30 分钟", 370, 30, "生活"),
    Object.assign(createTask("买生日礼物", 520, 20, "生活"), { status:"completed" })
  ];
  writeTasks();
}
if (!tasks.length) seed();

function priorityMult(p) { return p === "mustDo" ? 1.25 : p === "important" ? 1.15 : 1; }
function urgency(task, now=Date.now()) {
  if (task.status === "completed") return "done";
  if (task.snoozeUntil && new Date(task.snoozeUntil).getTime() > now) return "calm";
  const left = (new Date(task.deadline).getTime() - now) / 1000;
  if (left <= 0) return "overdue";
  const d = Math.max(task.duration*60, 60);
  const m = priorityMult(task.priority);
  if (left <= Math.max(d*1.1, 900)*m) return "danger";
  if (left <= Math.max(d*1.75, 1800)*m) return "urgent";
  if (left <= Math.max(d*2.5, 3600)*m) return "notice";
  return "calm";
}
const ranks = { done:-1, calm:0, notice:1, urgent:2, danger:3, overdue:4 };
function risk(task) { return (new Date(task.deadline)-Date.now()) / Math.max(task.duration*60000, 60000); }
function primaryTask() {
  return tasks.filter(t => t.status !== "completed").sort((a,b) => {
    const ua = urgency(a), ub = urgency(b);
    if (ranks[ua] !== ranks[ub]) return ranks[ub] - ranks[ua];
    if (priorityMult(a.priority) !== priorityMult(b.priority)) return priorityMult(b.priority) - priorityMult(a.priority);
    return risk(a) - risk(b);
  })[0] || null;
}
function artState(state) { return state === "overdue" ? "danger" : state; }
function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function when(d) {
  return new Date(d).toLocaleString("zh-CN", { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" });
}
function words(ms) {
  const neg = ms < 0;
  ms = Math.abs(ms);
  const min = Math.floor(ms / 60000);
  const h = Math.floor(min / 60);
  const m = min % 60;
  return `${neg ? "超时 " : ""}${h ? h+"小时 " : ""}${m}分钟`;
}
function clock(ms) {
  const neg = ms < 0;
  ms = Math.abs(ms);
  const sec = Math.floor(ms/1000);
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  const s = sec % 60;
  return `${neg ? "-" : ""}${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function dodoHTML(state, size=200, extra="") {
  const s = artState(state);
  return `
    <div class="dodo ${s === 'done' ? 'wrap-done' : ''}" data-state="${s}" style="width:${size}px;height:${size}px">
      <img src="${ART[s]}" alt="小待 ${s}">
      <div class="blink"></div>
    </div>
  `;
}

function scheduleBlink(actor) {
  if (!actor || actor.dataset.blinkBound) return;
  actor.dataset.blinkBound = "1";
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced) return;
  function once() {
    if (!document.body.contains(actor)) return;
    actor.classList.add("blinking");
    setTimeout(() => actor.classList.remove("blinking"), 120 + Math.random()*40);
    setTimeout(() => {
      if (Math.random() < 0.28 && document.body.contains(actor)) {
        actor.classList.add("blinking");
        setTimeout(() => actor.classList.remove("blinking"), 95 + Math.random()*35);
      }
    }, 150 + Math.random()*130);
    actor._blinkTimer = setTimeout(once, 2500 + Math.random()*4200);
  }
  actor._blinkTimer = setTimeout(once, 1200 + Math.random()*2200);
}

function animateLoop(actor) {
  if (!actor || actor.dataset.motionBound) return;
  actor.dataset.motionBound = "1";
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced) return;

  const state = actor.dataset.state;
  scheduleBlink(actor);

  function later(fn, min, max) {
    const delay = min + Math.random()*(max-min);
    actor._motionTimer = setTimeout(() => { if (document.body.contains(actor)) fn(); }, delay);
  }

  function pulseSpark() {
    if (state !== "done") return;
    actor.classList.remove("spark");
    void actor.offsetWidth;
    actor.classList.add("spark");
  }

  function play(frames, options, nextMin, nextMax, extraCb=null) {
    const anim = actor.animate(frames, Object.assign({
      fill:"none",
      easing:"cubic-bezier(.23,.72,.23,1)"
    }, options));
    anim.onfinish = () => {
      if (extraCb) extraCb();
      later(loop, nextMin, nextMax);
    };
  }

  function loop() {
    if (!document.body.contains(actor)) return;
    if (state === "calm") {
      play(
        [
          { transform:"translate3d(0,0,0) scale(1,1)" },
          { transform:"translate3d(0,-2px,0) scale(1.008,.994)", offset:.26 },
          { transform:"translate3d(1px,-5px,0) scale(1.015,.986)", offset:.55 },
          { transform:"translate3d(-1px,-3px,0) scale(1.01,.992)", offset:.77 },
          { transform:"translate3d(0,0,0) scale(1,1)" }
        ],
        { duration:3100 + Math.random()*900 },
        900, 2200
      );
    } else if (state === "notice") {
      play(
        [
          { transform:"translate3d(0,0,0) rotate(0deg) scale(1)" },
          { transform:"translate3d(0,-3px,0) rotate(-1.2deg) scale(1.012)", offset:.25 },
          { transform:"translate3d(2px,-5px,0) rotate(1.6deg) scale(1.018)", offset:.48 },
          { transform:"translate3d(-1px,-2px,0) rotate(-.8deg) scale(1.01)", offset:.72 },
          { transform:"translate3d(0,0,0) rotate(0deg) scale(1)" }
        ],
        { duration:1300 + Math.random()*260 },
        1800, 3600
      );
    } else if (state === "urgent") {
      play(
        [
          { transform:"translate3d(0,0,0) rotate(0deg) scale(1)" },
          { transform:"translate3d(0,-2px,0) rotate(-.6deg) scale(1.012)", offset:.18 },
          { transform:"translate3d(2px,-5px,0) rotate(.9deg) scale(1.018)", offset:.42 },
          { transform:"translate3d(-2px,-3px,0) rotate(-.5deg) scale(1.015)", offset:.65 },
          { transform:"translate3d(0,-1px,0) rotate(.2deg) scale(1.008)", offset:.84 },
          { transform:"translate3d(0,0,0) rotate(0deg) scale(1)" }
        ],
        { duration:1180 + Math.random()*220 },
        1500, 3000
      );
    } else if (state === "danger") {
      play(
        [
          { transform:"translate3d(0,0,0) scale(1)", filter:"drop-shadow(0 14px 18px rgba(57,82,99,.15))" },
          { transform:"translate3d(0,-5px,0) scale(1.03)", filter:"drop-shadow(0 20px 23px rgba(223,70,83,.22))", offset:.22 },
          { transform:"translate3d(-2px,-3px,0) rotate(-1deg) scale(1.02)", offset:.42 },
          { transform:"translate3d(2px,-3px,0) rotate(.9deg) scale(1.02)", offset:.58 },
          { transform:"translate3d(-1px,-1px,0) rotate(-.4deg) scale(1.01)", offset:.75 },
          { transform:"translate3d(0,0,0) scale(1)", filter:"drop-shadow(0 14px 18px rgba(57,82,99,.15))" }
        ],
        { duration:980 + Math.random()*200 },
        1100, 2200
      );
    } else if (state === "done") {
      play(
        [
          { transform:"translate3d(0,0,0) scale(1)" },
          { transform:"translate3d(0,-12px,0) scale(1.06,.98)", offset:.26 },
          { transform:"translate3d(0,4px,0) scale(.985,1.015)", offset:.57 },
          { transform:"translate3d(0,-4px,0) scale(1.01,.998)", offset:.78 },
          { transform:"translate3d(0,0,0) scale(1)" }
        ],
        { duration:900 },
        3400, 6200,
        pulseSpark
      );
    }
  }

  later(loop, 300, 900);
}

function bindDodos(scope=document) {
  scope.querySelectorAll(".dodo").forEach(animateLoop);

          <div class="taskIcon">${dodoHTML(u, 54)}</div>
          <div>
            <strong>${esc(t.title)}</strong>
            <div class="sub">${t.status === 'completed' ? '已完成' : when(t.deadline)} · ${esc(t.category)}</div>
          </div>
          <button class="play" ${t.status === 'completed' ? 'disabled' : `onclick="startFocus('${t.id}')"`}>${t.status === 'completed' ? '✓' : '▶'}</button>
        </div>
      `;
    })
    .join("");

  bindDodos(root);
}

function renderFocus(force=false) {
  const root = $("#focusRoot");
  const t = tasks.find(x => x.id === focusId && x.status !== "completed");
  if (!t) {
    if (!force && root.dataset.sig === "none") return;
    root.dataset.sig = "none";
    root.innerHTML = `<div class="empty">${dodoHTML("calm",185)}<h2>还没有开始任务</h2><p>从“现在”或“今天”选择一件事开始。</p></div>`;
    bindDodos(root);
    return;
  }

  if (!t.startedAt) t.startedAt = new Date().toISOString();
  const sig = t.id;
  if (!force && root.dataset.sig === sig) return;
  root.dataset.sig = sig;

  root.innerHTML = `
    <div class="focusCard">
      <div class="focusTitle">专注中</div>
      <div class="meta">${esc(t.title)} · ${esc(t.category)}</div>
      <div class="focusStage">${dodoHTML("urgent", 198)}</div>
      <div class="ring" id="focusRing">
        <div class="ringInner">
          <div>
            <div class="focusTime" id="focusTimer">00:00:00</div>
            <div class="meta">专注进行中</div>
            <div style="margin-top:8px;color:#9b7d51">你可以的！♡</div>
          </div>
        </div>
      </div>
      <div class="focusActions">
        <button class="circleBtn" onclick="leaveFocus()">×</button>
        <button class="circleBtn main" onclick="pauseDemo()">Ⅱ</button>
        <button class="circleBtn" onclick="completeTask('${t.id}')">✓</button>
      </div>
    </div>
  `;
  bindDodos(root);
}

function renderIsland(force=false) {
  const el = $("#island");
  const t = primaryTask();
  if (!settings.island || !t) {
    el.classList.add("hidden");
    el.dataset.sig = "";
    return;
  }
  const sig = `${t.id}:${urgency(t)}`;
  if (force || el.dataset.sig !== sig) {
    el.dataset.sig = sig;
    el.innerHTML = `
      <div class="islandMini">${dodoHTML(urgency(t), 31)}</div>
      <strong>${esc(t.title)}</strong>
      <span id="islandRemain">${words(new Date(t.deadline)-Date.now())}</span>
    `;
    bindDodos(el);
  }
  el.classList.remove("hidden");
}

function renderCharLab() {
  const states = ["calm","notice","urgent","danger","done"];
  const labels = { calm:"Calm", notice:"Notice", urgent:"Urgent", danger:"Danger", done:"Done" };
  $("#charButtons").innerHTML = states.map(s => `<button class="charBtn ${previewState===s?'active':''}" data-state="${s}">${labels[s]}</button>`).join("");
  $("#charPreview").innerHTML = dodoHTML(previewState, 196);
  $("#charButtons").querySelectorAll(".charBtn").forEach(btn => btn.onclick = () => {
    previewState = btn.dataset.state;
    renderCharLab();
  });
  bindDodos($("#charPreview"));
}

function renderSettings() {
  $("#toggleIsland").checked = settings.island;
  $("#toggleDanger").checked = settings.danger;
  renderCharLab();
}

function renderAll(force=false) {
  renderNow(force);
  renderToday(force);
  renderFocus(force);
  renderIsland(force);
  if (currentView === "settings") renderSettings();
}

function updateClocks() {
  const p = primaryTask();
  if (p) {
    document.querySelectorAll(`[data-left-for="${p.id}"]`).forEach(el => el.textContent = words(new Date(p.deadline)-Date.now()));
    const ir = $("#islandRemain");
    if (ir) ir.textContent = words(new Date(p.deadline)-Date.now());
  }
  const t = tasks.find(x => x.id === focusId && x.status !== "completed");
  if (t && t.startedAt) {
    const duration = t.duration * 60000;
    const end = new Date(t.startedAt).getTime() + duration;
    const left = end - Date.now();
    const timer = $("#focusTimer");
    const ring = $("#focusRing");
    if (timer) timer.textContent = clock(left);
    if (ring) {
      const pct = Math.max(8, Math.min(100, (1 - left/duration) * 100));
      ring.style.setProperty("--progress", `${pct}%`);
    }
  }
}

function maybeDanger(force=false) {
  const t = primaryTask();
  const screen = $("#dangerScreen");
  if (!t || !settings.danger) {
    screen.classList.add("hidden");
    return;
  }
  const u = urgency(t);
  if (!force && !["danger","overdue"].includes(u)) {
    screen.classList.add("hidden");
    return;
  }
  if (!force && focusId === t.id) {
    screen.classList.add("hidden");
    return;
  }
  const key = "v41danger." + t.id + "." + new Date(t.deadline).getTime();
  if (!force && sessionStorage.getItem(key)) return;
  sessionStorage.setItem(key, "1");

  $("#dangerDodo").innerHTML = dodoHTML("danger", 246);
  bindDodos($("#dangerDodo"));
  $("#dangerTitle").textContent = t.title;
  $("#dangerMeta").textContent = `${when(t.deadline)} 截止 · 还有 ${words(new Date(t.deadline)-Date.now())}`;
  $("#dangerStart").onclick = () => { screen.classList.add("hidden"); startFocus(t.id); };
  $("#dangerLater").onclick = () => {
    t.snoozeUntil = new Date(Date.now() + 15*60000).toISOString();
    writeTasks();
    screen.classList.add("hidden");
    renderAll(true);
  };
  screen.classList.remove("hidden");
}

function switchView(name) {
  currentView = name;
  $$(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + name));
  $$(".tab").forEach(t => t.classList.toggle("active", t.dataset.view === name));
  renderAll(true);
  updateClocks();
}

function startFocus(id) {
  focusId = id;
  const t = tasks.find(x => x.id === id);
  if (t && !t.startedAt) t.startedAt = new Date().toISOString();
  writeTasks();
  $("#dangerScreen").classList.add("hidden");
  switchView("focus");
}
function leaveFocus() { focusId = null; switchView("now"); }
function pauseDemo() {
  alert("这里先保留为体验版演示：正式版会做成真实暂停。");
}
function completeTask(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  t.status = "completed";
  t.completedAt = new Date().toISOString();
  writeTasks();
  focusId = null;
  $("#doneDodo").innerHTML = dodoHTML("done", 248);
  bindDodos($("#doneDodo"));
  $("#doneFlash").classList.remove("hidden");
  setTimeout(() => {
    $("#doneFlash").classList.add("hidden");
    switchView("now");
  }, 1500);
}

function openModal() {
  const d = new Date(Date.now() + 2*3600000);
  d.setSeconds(0,0);
  $("#deadline").value = new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
  $("#modal").classList.remove("hidden");
}
function closeModal() { $("#modal").classList.add("hidden"); }

$("#addTask").onclick = openModal;
$("#addTask2").onclick = openModal;
$("#closeModal").onclick = closeModal;
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

$("#form").onsubmit = e => {
  e.preventDefault();
  tasks.push({
    id: uid(),
    title: $("#title").value.trim(),
    deadline: new Date($("#deadline").value).toISOString(),
    duration: Number($("#duration").value),
    category: $("#category").value,
    priority: $("#priority").value,
    status: "active",
    startedAt: null,
    snoozeUntil: null
  });
  writeTasks();
  e.target.reset();
  $("#duration").value = 45;
  closeModal();
  renderAll(true);
  updateClocks();
};

$$(".tab").forEach(btn => btn.onclick = () => switchView(btn.dataset.view));
$("#toggleIsland").onchange = e => { settings.island = e.target.checked; writeSettings(); renderIsland(true); };
$("#toggleDanger").onchange = e => { settings.danger = e.target.checked; writeSettings(); };
$("#demoDanger").onclick = () => maybeDanger(true);
$("#resetDemo").onclick = () => { seed(); focusId = null; renderAll(true); updateClocks(); };

renderBrand();
renderAll(true);
updateClocks();

setInterval(() => {
  updateClocks();
  const p = primaryTask();
  const sig = p ? `${p.id}:${urgency(p)}` : "none";
  if (sig !== lastPrimarySig) {
    lastPrimarySig = sig;
    renderNow(true);
    renderToday(true);
    renderIsland(true);
    updateClocks();
  }
  maybeDanger(false);
}, 1000);
</script>
</body>
</html>
