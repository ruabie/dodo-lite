<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小待 V5.1 Calm Character Prototype</title>
<style>
:root{--ink:#122d4d;--muted:#8192a6;--green:#55c98b;--blue:#70b5ff;--bg:#f6fbff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif;background:linear-gradient(#fbfdff,#eff7fb);color:var(--ink)}
body{display:flex;justify-content:center}
.wrap{width:min(100%,520px);min-height:100vh;padding:calc(22px + env(safe-area-inset-top)) 18px calc(34px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.top h1{font-size:24px;margin:0;letter-spacing:-.04em}.badge{font-size:12px;padding:7px 10px;border-radius:999px;background:#e8f8ef;color:#2e9465;font-weight:800}
.card{background:#fff;border-radius:30px;padding:20px;box-shadow:0 18px 48px rgba(45,79,111,.12)}
.copy{text-align:center}.copy h2{margin:2px 0 4px;font-size:24px}.copy p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.stage{position:relative;height:410px;margin-top:8px;border-radius:26px;overflow:hidden;background:
radial-gradient(circle at 50% 28%,#fff 0 18%,#eefcff 48%,#e8f9ef 100%);
display:grid;place-items:center}
.stage:before,.stage:after{content:"";position:absolute;bottom:-38px;width:220px;height:100px;border-radius:50% 50% 0 0;opacity:.68}
.stage:before{left:-60px;background:#cfeedd}.stage:after{right:-65px;background:#d8efff}

.rigWrap{position:relative;width:320px;height:300px;transform:translateY(12px);cursor:pointer;touch-action:manipulation}
.shadow{position:absolute;left:50%;bottom:24px;width:156px;height:26px;border-radius:50%;transform:translateX(-50%);background:rgba(41,74,92,.14);filter:blur(8px);z-index:0}
.bodyGroup{position:absolute;left:50%;top:68px;width:230px;height:205px;transform:translateX(-50%);transform-origin:50% 75%;z-index:3}
.part{position:absolute;pointer-events:none;user-select:none}
.body{left:0;top:0;width:230px;height:205px;object-fit:contain}
.face{left:50%;top:66px;width:110px;height:58px;transform:translateX(-50%);object-fit:contain;z-index:8}
.note{left:50%;top:-39px;width:102px;height:74px;transform:translateX(-50%) rotate(0deg);transform-origin:50% 80%;z-index:10}
.arm{width:72px;height:88px;object-fit:contain;z-index:7;transform-origin:50% 75%}
.armL{left:-7px;top:82px}.armR{right:-7px;top:82px}
.foot{width:86px;height:56px;object-fit:contain;z-index:2;transform-origin:50% 50%}
.footL{left:38px;bottom:-1px}.footR{right:38px;bottom:-1px}
.fx{position:absolute;inset:0;z-index:15;pointer-events:none}
.fx span{position:absolute;opacity:0;font-size:23px;font-weight:900}
.fx .heart{right:36px;top:72px;color:#56c98c}.fx .spark{left:36px;top:102px;color:#ffd24b}

.hint{position:absolute;left:50%;bottom:13px;transform:translateX(-50%);padding:8px 12px;background:rgba(255,255,255,.72);backdrop-filter:blur(12px);border-radius:999px;font-size:12px;color:#688099;z-index:20}
.status{margin-top:14px;border-radius:20px;background:#f4f8fb;padding:13px 15px;display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:#55c98b;box-shadow:0 0 0 5px rgba(85,201,139,.12)}
.status strong{font-size:14px}.status span{font-size:12px;color:var(--muted)}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.controls button{border:0;border-radius:16px;padding:13px 8px;background:#edf4fa;color:#294764;font-weight:800}
.controls button.primary{background:linear-gradient(90deg,#4cc687,#66d39a);color:#fff}
.notes{margin-top:16px;background:#fff;border-radius:24px;padding:16px 18px;box-shadow:0 10px 26px rgba(45,79,111,.07)}
.notes h3{margin:0 0 8px;font-size:16px}.notes p{margin:0;color:#71869d;font-size:13px;line-height:1.65}
.eventlog{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.pill{padding:6px 9px;border-radius:999px;background:#f1f6fa;color:#71869d;font-size:11px}
@media(max-height:760px){.stage{height:350px}.rigWrap{transform:translateY(-6px) scale(.9);transform-origin:50% 50%}}
</style></head><body>
<div class="wrap">
 <div class="top"><h1>小待 V5.1</h1><div class="badge">Calm Prototype</div></div>
 <div class="card">
  <div class="copy"><h2>先把“站着就有生命感”做好</h2><p>不是一直动，而是会呼吸、会眨眼、会观察，也会回应你的点击。</p></div>
  <div class="stage">
   <div class="rigWrap" id="rig" aria-label="小待 Calm 角色">
    <div class="shadow" id="shadow"></div>
    <div class="bodyGroup" id="bodyGroup">
      <img class="part foot footL" id="footL">
      <img class="part foot footR" id="footR">
      <img class="part body" id="body">
      <img class="part arm armL" id="armL">
      <img class="part arm armR" id="armR">
      <img class="part face" id="face">
      <img class="part note" id="note">
    </div>
    <div class="fx"><span class="heart" id="heart">♥</span><span class="spark" id="spark">✦</span></div>
   </div>
   <div class="hint">点一下小待试试</div>
  </div>
  <div class="status"><div class="dot"></div><div><strong id="actionTitle">Idle · 安静陪伴</strong><br><span id="actionSub">动作之间会随机停顿，不做机械循环</span></div></div>
  <div class="controls">
   <button id="toggleAuto" class="primary">自动动作：开</button>
   <button id="doBlink">眨眼</button>
   <button id="doLook">看看你</button>
  </div>
 </div>
 <div class="notes">
  <h3>V5.1 动画原则</h3>
  <p>身体、双手、双脚、便签、表情和阴影现在是独立层。动作使用蓄力 → 主动作 → 轻微过冲 → 回弹 → 停顿，并让不同部位有几十毫秒的跟随延迟。</p>
  <div class="eventlog"><span class="pill">随机眨眼</span><span class="pill">轻呼吸</span><span class="pill">重心转移</span><span class="pill">视线反馈</span><span class="pill">点击回应</span></div>
 </div>
</div>

let auto=true, busy=false, timer=null;

const easing="cubic-bezier(.22,.78,.22,1)";
function wa(el,frames,opts={}){return el.animate(frames,Object.assign({duration:650,easing,fill:"none"},opts))}
function setStatus(a,b){actionTitle.textContent=a;actionSub.textContent=b}

async function blink(){
 if(busy)return; busy=true; setStatus("Blink · 眨眼","非常短，不抢注意力");
 face.src=ART.faceBlink; await delay(115); face.src=ART.faceNeutral;

}
